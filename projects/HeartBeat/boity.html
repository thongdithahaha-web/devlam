<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tơ Hồng - Bói Tình Yêu & Nhịp Đập Trái Tim</title>
    <link href="https://fonts.googleapis.com/css2?family=Playpen+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Playpen Sans', cursive, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #1e1b4b, #3b0764, #0f172a);
            color: #f3f4f6;
            padding: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 30px;
            padding: 35px 25px;
            max-width: 440px;
            width: 100%;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.8s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            font-size: 1.8rem;
            color: #ec4899;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        p.subtitle {
            font-size: 0.9rem;
            color: #9ca3af;
            margin-bottom: 25px;
        }

        .heart-icon {
            font-size: 50px;
            color: #ec4899;
            margin: 10px auto 20px;
            animation: pulse 1.2s infinite ease-in-out;
            display: inline-block;
        }

        @keyframes pulse {
            0% { transform: scale(1); filter: drop-shadow(0 0 5px rgba(236, 72, 153, 0.4)); }
            50% { transform: scale(1.15); filter: drop-shadow(0 0 20px rgba(236, 72, 153, 0.8)); }
            100% { transform: scale(1); filter: drop-shadow(0 0 5px rgba(236, 72, 153, 0.4)); }
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            text-align: center;
            transition: all 0.3s ease;
        }

        input:focus {
            border-color: #ec4899;
            background: rgba(255, 255, 255, 0.12);
            box-shadow: 0 0 0 3px rgba(236, 72, 153, 0.25);
        }

        input::placeholder {
            color: #9ca3af;
        }

        .btn-check {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(135deg, #ec4899, #8b5cf6);
            color: white;
            font-size: 1.05rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(236, 72, 153, 0.4);
            transition: all 0.3s ease;
        }

        .btn-check:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(236, 72, 153, 0.6);
        }

        #result {
            display: none;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px dashed rgba(255, 255, 255, 0.15);
            animation: fadeIn 0.5s ease;
        }

        .score-circle {
            font-size: 2.2rem;
            font-weight: 800;
            color: #38bdf8;
            margin-bottom: 10px;
        }

        .message {
            font-size: 0.95rem;
            color: #e5e7eb;
            line-height: 1.6;
        }

        .back-link {
            display: inline-block;
            margin-top: 25px;
            color: #9ca3af;
            text-decoration: none;
            font-size: 0.85rem;
        }

        .back-link:hover {
            color: #ec4899;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1><i class="fa-solid fa-heart"></i> Tơ Hồng Tình Duyên</h1>
        <p class="subtitle">Đo độ hòa hợp và nhịp đập con tim giữa hai bạn</p>

        <div class="heart-icon"><i class="fa-solid fa-heart-pulse"></i></div>

        <div class="input-group">
            <input type="text" id="name1" placeholder="Nhập tên của bạn...">
            <input type="text" id="name2" placeholder="Nhập tên người ấy...">
        </div>

        <button class="btn-check" onclick="calculateLove()">Bói Duyên Ngay ❤️</button>

        <div id="result">
            <div class="score-circle" id="score">99%</div>
            <p class="message" id="message">Hai bạn sinh ra là để dành cho nhau!</p>
        </div>

        <div>
            <a href="../../index.html" class="back-link">⬅ Quay về trang chủ lekimlamdev</a>
        </div>
    </div>

    <script>
        function calculateLove() {
            const n1 = document.getElementById('name1').value.trim();
            const n2 = document.getElementById('name2').value.trim();

            if (!n1 || !n2) {
                alert('Vui lòng nhập tên cả hai người nhé!');
                return;
            }

            // Consistent hash algorithm based on characters
            let sum = 0;
            const combined = (n1 + n2).toLowerCase().replace(/\s+/g, '');
            for (let i = 0; i < combined.length; i++) {
                sum += combined.charCodeAt(i) * (i + 1);
            }

            const score = 75 + (sum % 25); // Range 75% - 99% for sweet positive results
            const scoreEl = document.getElementById('score');
            const msgEl = document.getElementById('message');
            const resEl = document.getElementById('result');

            scoreEl.textContent = score + '%';

            let msg = '';
            if (score >= 95) {
                msg = `💖 Mối duyên tiền định! ${n1} và ${n2} sinh ra là dành cho nhau, hãy trân trọng từng khoảnh khắc nhé!`;
            } else if (score >= 88) {
                msg = `✨ Độ hợp nhau cực kỳ cao! Giữa ${n1} và ${n2} luôn có một sợi tơ hồng gắn kết vô cùng đặc biệt.`;
            } else {
                msg = `🌸 Tình yêu đẹp và bền chặt! Càng thấu hiểu và sẻ chia thì ${n1} và ${n2} càng hạnh phúc hơn nữa.`;
            }

            msgEl.textContent = msg;
            resEl.style.display = 'block';
        }
    </script>
</body>
</html>
