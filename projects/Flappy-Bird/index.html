<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="robots" content="index, follow">
    <meta name="keywords" content="lập trình, thiết kế web, javascript, html, css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Flappy Bird</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #2c3e50;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Press Start 2P', cursive;
            overflow: hidden;
            touch-action: none;
        }

        #game-container {
            position: relative;
            width: 100%;
            max-width: 431px;
            height: 100%;
            max-height: 768px;
            aspect-ratio: 431 / 768;
            background: #54becc;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }

        @media (min-width: 480px) {
            #game-container {
                height: 90vh;
                border-radius: 8px;
            }
        }

        header {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 10;
        }

        .score-container {
            display: flex;
            justify-content: space-between;
            padding: 20px;
            color: #fff;
            font-size: 14px;
            text-shadow: 2px 2px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
            /* Viền đen cho chữ */
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
    </style>
</head>

<body translate="no">

    <div id="game-container">
        <header>
            <div class="score-container">
                <div id="bestScore">Best: 0</div>
                <div id="currentScore">Score: 0</div>
            </div>
        </header>

        <canvas id="canvas" width="431" height="768"></canvas>
    </div>

    <script>
const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const img = new Image();
        img.src = "./flappybird.png";

        // --- 1. KHAI BÁO ÂM THANH ---
        const soundFlap = new Audio('https://github.com/SamSamskies/flappy-bird-assets/raw/master/audio/wing.ogg');
        const soundPoint = new Audio('https://github.com/SamSamskies/flappy-bird-assets/raw/master/audio/point.ogg');
        const soundDie = new Audio('./die.mp3');

        let gamePlaying = false;
        const gravity = 0.5;
        const speed = 6.2;
        const size = [51, 36];
        const jump = -11.5;
        const cTenth = canvas.width / 10;

        let index = 0,
            bestScore = 0,
            flight,
            flyHeight,
            currentScore,
            pipes;

        const pipeWidth = 78;
        const pipeGap = 270;
        const pipeLoc = () => Math.random() * (canvas.height - (pipeGap + pipeWidth) - pipeWidth) + pipeWidth;

        const setup = () => {
            currentScore = 0;
            flight = jump;
            flyHeight = canvas.height / 2 - size[1] / 2;
            pipes = Array(3).fill().map((a, i) => [canvas.width + i * (pipeGap + pipeWidth), pipeLoc()]);
        };

        const render = () => {
            index++;

            // Vẽ background di chuyển
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height, -(index * (speed / 2) % canvas.width) + canvas.width, 0, canvas.width, canvas.height);
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height, -(index * (speed / 2)) % canvas.width, 0, canvas.width, canvas.height);

            if (gamePlaying) {
                pipes.map(pipe => {
                    pipe[0] -= speed;

                    // Vẽ ống trên và dưới
                    ctx.drawImage(img, 432, 588 - pipe[1], pipeWidth, pipe[1], pipe[0], 0, pipeWidth, pipe[1]);
                    ctx.drawImage(img, 432 + pipeWidth, 108, pipeWidth, canvas.height - pipe[1] + pipeGap, pipe[0], pipe[1] + pipeGap, pipeWidth, canvas.height - pipe[1] + pipeGap);

                    // Cộng điểm
                    if (pipe[0] <= -pipeWidth) {
                        currentScore++;
                        soundPoint.play(); // PHÁT ÂM THANH GHI ĐIỂM
                        bestScore = Math.max(bestScore, currentScore);
                        pipes = [...pipes.slice(1), [pipes[pipes.length - 1][0] + pipeGap + pipeWidth, pipeLoc()]];
                    }

                    // Xử lý va chạm ống
                    if ([
                        pipe[0] <= cTenth + size[0],
                        pipe[0] + pipeWidth >= cTenth,
                        pipe[1] > flyHeight || pipe[1] + pipeGap < flyHeight + size[1]
                    ].every(elem => elem)) {
                        soundDie.play(); // PHÁT ÂM THANH VA CHẠM
                        gamePlaying = false;
                        setup();
                    }
                });

                // --- 2. XỬ LÝ CHẠM PHẦN DƯỚI (ĐẤT) ---
                if (flyHeight + size[1] >= canvas.height) {
                    soundDie.play(); // PHÁT ÂM THANH KHI RƠI XUỐNG ĐẤT
                    gamePlaying = false;
                    setup();
                }
            }

            // Vẽ con chim
            if (gamePlaying) {
                ctx.drawImage(img, 432, Math.floor(index % 9 / 3) * size[1], ...size, cTenth, flyHeight, ...size);
                flight += gravity;
                flyHeight = Math.min(flyHeight + flight, canvas.height - size[1]);
            } else {
                ctx.drawImage(img, 432, Math.floor(index % 9 / 3) * size[1], ...size, canvas.width / 2 - size[0] / 2, flyHeight, ...size);
                flyHeight = canvas.height / 2 - size[1] / 2;

                ctx.textAlign = "center";
                ctx.font = "24px 'Press Start 2P', Courier";
                ctx.fillStyle = "white";
                ctx.lineWidth = 4;
                ctx.strokeStyle = "black";

                ctx.strokeText(`Best: ${bestScore}`, canvas.width / 2, 245);
                ctx.fillText(`Best: ${bestScore}`, canvas.width / 2, 245);

                ctx.strokeText('Tap to play', canvas.width / 2, 535);
                ctx.fillText('Tap to play', canvas.width / 2, 535);
            }

            document.getElementById('bestScore').innerHTML = `Best: ${bestScore}`;
            document.getElementById('currentScore').innerHTML = `Score: ${currentScore}`;

            window.requestAnimationFrame(render);
        };

        setup();
        img.onload = render;

        const jumpAction = (e) => {
            if (e) e.preventDefault();
            if (!gamePlaying) {
                gamePlaying = true;
            }
            flight = jump;

            // Reset và phát âm thanh nhảy
            soundFlap.currentTime = 0;
            soundFlap.play();
        };

        document.addEventListener('mousedown', jumpAction);
        document.addEventListener('touchstart', jumpAction, { passive: false });
        // Xóa window.onclick cũ vì mousedown/touchstart đã bao phủ đủ
    </script>
</body>

</html>
