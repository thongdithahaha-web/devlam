    <link
        href="https://fonts.googleapis.com/css2?family=Mali:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700;1,200;1,300;1,400;1,500;1,600;1,700&display=swap"

<body>

    <dev id="devlekimlam"></dev><dev id="Devpan" style="display:none"></dev>

    <script>
(function (d) {
            if (!d.__cssInjected) {
                d.__cssInjected = true;
                const css = `:root{--bg-deep:#020617;--card-bg:rgba(30,41,59,0.7);--gold:#d4af37;--gold-light:#f9e29c;--text-gold:#e2c275;--text-main:#f8fafc;--text-muted:#94a3b8;--accent:#1e293b;--border:rgba(212,175,55,0.3);--radius:20px;}*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}body{font-family:"Mali",cursive;background:radial-gradient(circle at top right,#1e293b,#020617);color:var(--text-main);min-height:100vh;display:flex;justify-content:center;align-items:center;padding:15px;}.app-wrapper{width:100%;max-width:1100px;display:grid;grid-template-columns:1fr 380px;gap:25px;animation:fadeIn 1s ease;}.calendar-card{background:var(--card-bg);backdrop-filter:blur(15px);border-radius:var(--radius);border:1px solid var(--border);overflow:hidden;box-shadow:0 25px 50px -12px rgba(0,0,0,0.5);}.calendar-header{padding:30px;background:linear-gradient(to bottom,rgba(212,175,55,0.1),transparent);text-align:center;}.nav-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;}.month-label{font-family:"Mali",cursive;font-size:2.2rem;font-weight:800;color:var(--gold-light);text-shadow:0 2px 10px rgba(0,0,0,0.5);}.btn-nav{background:transparent;border:1px solid var(--border);color:var(--gold);width:40px;height:40px;border-radius:50%;cursor:pointer;transition:0.3s;}.btn-nav:hover{background:var(--gold);color:var(--bg-deep);}.selectors{display:flex;gap:10px;justify-content:center;}select{background:var(--accent);border:1px solid var(--border);color:var(--text-gold);padding:6px 15px;border-radius:20px;font-size:0.85rem;outline:none;}.calendar-body{padding:20px 30px 30px;}.weekdays{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-weight:700;font-size:0.75rem;color:var(--text-muted);margin-bottom:15px;text-transform:uppercase;}.days-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;}.day-cell{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:12px;border:1px solid rgba(255,255,255,0.05);cursor:pointer;transition:0.3s;}.day-cell:hover{background:rgba(212,175,55,0.1);border-color:var(--gold);}.day-cell.today{border:1.5px solid var(--gold);background:rgba(212,175,55,0.05);}.day-cell.selected{background:var(--gold) !important;color:var(--bg-deep) !important;box-shadow:0 0 20px rgba(212,175,55,0.4);}.solar{font-size:1.1rem;font-weight:700;}.lunar{font-size:0.65rem;opacity:0.7;margin-top:2px;}.selected .lunar{opacity:1;font-weight:600;}.side-panel{display:flex;flex-direction:column;gap:20px;}.glass-card{background:var(--card-bg);backdrop-filter:blur(15px);border-radius:var(--radius);border:1px solid var(--border);padding:25px;}.detail-day{text-align:center;}.big-solar{font-family:"Mali",cursive;font-size:4.5rem;font-weight:700;color:var(--gold);line-height:1;margin:10px 0;}.info-item{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid rgba(255,255,255,0.05);font-size:0.9rem;}.info-item span{color:var(--text-muted);}.info-item b{color:var(--text-gold);}.fortune-title{font-size:1.1rem;color:var(--gold);margin-bottom:15px;display:flex;align-items:center;gap:10px;text-transform:uppercase;font-weight:700;}.input-group{margin-bottom:12px;}label{display:block;font-size:0.75rem;color:var(--text-muted);margin-bottom:5px;margin-left:5px;}input{width:100%;background:var(--accent);border:1px solid var(--border);padding:12px;border-radius:12px;color:white;outline:none;font-family:"Mali",cursive;}input:focus{border-color:var(--gold);}.btn-gold{width:100%;background:linear-gradient(135deg,var(--gold),var(--gold-light));border:none;padding:14px;border-radius:12px;color:var(--bg-deep);font-weight:700;cursor:pointer;margin-top:10px;text-transform:uppercase;transition:0.3s;font-family:"Mali",cursive;}.btn-gold:hover{transform:translateY(-2px);box-shadow:0 5px 15px rgba(212,175,55,0.4);}#fortuneRes{margin-top:20px;padding-top:15px;border-top:1px solid var(--border);font-size:0.9rem;line-height:1.6;color:var(--text-gold);display:none;animation:slideUp 0.5s ease;}@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}@keyframes slideUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}.hint-card{cursor:pointer;text-align:center;transition:0.3s;}.hint-card:hover{border-color:var(--gold);box-shadow:0 5px 20px rgba(212,175,55,0.2);transform:translateY(-2px);}.modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(2,6,23,0.85);backdrop-filter:blur(8px);z-index:1000;display:none;justify-content:center;align-items:center;animation:fadeIn 0.3s ease;}.modal-content{width:90%;max-width:420px;position:relative;transform:translateY(20px);animation:slideUpModal 0.4s ease forwards;}.close-btn{position:absolute;top:15px;right:15px;background:transparent;border:none;color:var(--text-muted);font-size:1.5rem;line-height:1;cursor:pointer;transition:0.3s;}.close-btn:hover{color:var(--gold);transform:scale(1.1);}@keyframes slideUpModal{to{transform:translateY(0);}}@media (max-width:900px){.app-wrapper{grid-template-columns:1fr;}.side-panel{order:-1;}.big-solar{font-size:3.5rem;}}`;
                if (window.CSSStyleSheet && CSSStyleSheet.prototype.replaceSync && 'adoptedStyleSheets' in d) {
                    const s = new CSSStyleSheet();
                    s.replaceSync(css);
                    d.adoptedStyleSheets = [...d.adoptedStyleSheets, s];
                } else {
                    const t = d.createElement('style');
                    t.textContent = css;
                    d.head.appendChild(t);
                }
            }
        })(document);
        (function f() { const s = document.getElementById('sandbox') || document.body; s ? s.append(document.createRange().createContextualFragment(`<div class="app-wrapper"><div class="calendar-card"><div class="calendar-header"><div class="nav-row"><button class="btn-nav" onclick="changeMonth(-1)">❮</button><div class="month-label" id="curMonthYear">Tháng 04, 2024</div><button class="btn-nav" onclick="changeMonth(1)">❯</button></div><div class="selectors"><select id="mJump" onchange="jump()"></select><select id="yJump" onchange="jump()"></select></div></div><div class="calendar-body"><div class="weekdays"><div style="color:#ff5f57">CN</div><div>T2</div><div>T3</div><div>T4</div><div>T5</div><div>T6</div><div style="color:#57a4ff">T7</div></div><div class="days-grid" id="calendarGrid"></div></div></div><div class="side-panel"><div class="glass-card detail-day" id="detailPanel"></div><div class="glass-card hint-card" onclick="openFortuneModal()"><div class="fortune-title" style="justify-content: center; margin-bottom: 8px;"> Luận Giải Vận Mệnh </div><p style="font-size: 0.85rem; color: var(--text-muted); line-height: 1.5;"> Nhấn vào đây để xem lá số và vận hạn của bạn trong ngày hôm nay. </p></div></div></div><div id="fortuneModal" class="modal-overlay" onclick="closeFortuneModal(event)"><div class="modal-content glass-card" onclick="event.stopPropagation()"><button class="close-btn" onclick="closeFortuneModal()">×</button><div class="fortune-title" style="justify-content: center;"> Luận Giải Vận Mệnh </div><div class="input-group"><label>HỌ VÀ TÊN</label><input type="text" id="userName" placeholder="Nhập tên của bạn..."></div><div class="input-group"><label>NGÀY SINH</label><input type="date" id="userDob"></div><button class="btn-gold" onclick="getFortune()">Xem Vận Mệnh</button><div id="fortuneRes"></div></div></div></div>`)) : setTimeout(f, 4) })();
        // --- LUNAR LOGIC ---
        const LunarJS = {
            jdFromDate: (d, m, y) => {
                const a = Math.floor((14 - m) / 12);
                const y2 = y + 4800 - a; const m2 = m + 12 * a - 3;
                return d + Math.floor((153 * m2 + 2) / 5) + 365 * y2 + Math.floor(y2 / 4) - Math.floor(y2 / 100) + Math.floor(y2 / 400) - 32045;
            },
            getLunarFromSolar: function (d, m, y) {
                const jd = this.jdFromDate(d, m, y);
                const off = (jd - 2415021);
                const k = Math.floor(off / 29.5305888);
                const nm = Math.floor(2415020.75933 + 29.53058868 * k + 0.5);
                let monthStart = (nm > jd) ? Math.floor(2415020.75933 + 29.53058868 * (k - 1) + 0.5) : nm;
                let lDay = jd - monthStart + 1;
                let lMonth = (Math.floor((monthStart - 2415021) / 29.5306) % 12) + 2;
                if (lMonth > 12) lMonth -= 12;
                return { day: lDay, month: lMonth, year: y, jd: jd };
            }
        };

        const CAN = ['Giáp', 'Ất', 'Bính', 'Đinh', 'Mậu', 'Kỷ', 'Canh', 'Tân', 'Nhâm', 'Quý'];
        const CHI = ['Tý', 'Sửu', 'Dần', 'Mão', 'Thìn', 'Tỵ', 'Ngọ', 'Mùi', 'Thân', 'Dậu', 'Tuất', 'Hợi'];

        let currentView = new Date();
        let selectedDate = new Date();

        // --- MODAL LOGIC ---
        function openFortuneModal() {
            const modal = document.getElementById('fortuneModal');
            modal.style.display = 'flex';
            // Reset lại kết quả cũ (nếu muốn) mỗi khi mở
            // document.getElementById('fortuneRes').style.display = 'none'; 
        }

        function closeFortuneModal(e) {
            // Nếu có event truyền vào (click ra ngoài overlay) thì kiểm tra
            if (e && e.target !== document.getElementById('fortuneModal')) return;
            document.getElementById('fortuneModal').style.display = 'none';
        }
        function init() {
            const mS = document.getElementById('mJump');
            const yS = document.getElementById('yJump');
            for (let i = 0; i < 12; i++) mS.add(new Option('Tháng ' + (i + 1), i));
            const curY = new Date().getFullYear();
            for (let i = curY - 50; i <= curY + 50; i++) yS.add(new Option('Năm ' + i, i));

            // Load saved info
            document.getElementById('userName').value = localStorage.getItem('p_name') || '';
            document.getElementById('userDob').value = localStorage.getItem('p_dob') || '';

            render();
        }

        function render() {
            const grid = document.getElementById('calendarGrid');
            const m = currentView.getMonth();
            const y = currentView.getFullYear();

            document.getElementById('curMonthYear').innerText = `Tháng ${m + 1}, ${y}`;
            document.getElementById('mJump').value = m;
            document.getElementById('yJump').value = y;

            grid.innerHTML = '';
            const firstDay = new Date(y, m, 1).getDay();
            const daysInMonth = new Date(y, m + 1, 0).getDate();

            for (let i = 0; i < firstDay; i++) grid.appendChild(document.createElement('div'));

            for (let d = 1; d <= daysInMonth; d++) {
                const lunar = LunarJS.getLunarFromSolar(d, m + 1, y);
                const cell = document.createElement('div');
                const dow = new Date(y, m, d).getDay();

                cell.className = 'day-cell';
                if (dow === 0) cell.style.color = '#ff5f57';
                if (dow === 6) cell.style.color = '#57a4ff';

                if (d === new Date().getDate() && m === new Date().getMonth() && y === new Date().getFullYear()) cell.classList.add('today');
                if (d === selectedDate.getDate() && m === selectedDate.getMonth() && y === selectedDate.getFullYear()) {
                    cell.classList.add('selected');
                    updateDetail(d, m + 1, y, lunar);
                }

                cell.innerHTML = `<span class="solar">${d}</span><span class="lunar">${lunar.day}/${lunar.month}</span>`;
                cell.onclick = () => { selectedDate = new Date(y, m, d); render(); };
                grid.appendChild(cell);
            }
        }

        function updateDetail(d, m, y, lunar) {
            const dow = ["Chủ Nhật", "Thứ Hai", "Thứ Ba", "Thứ Tư", "Thứ Năm", "Thứ Sáu", "Thứ Bảy"][new Date(y, m - 1, d).getDay()];
            const canDay = CAN[(lunar.jd + 9) % 10];
            const chiDay = CHI[(lunar.jd + 1) % 12];
            const canYear = CAN[(y - 4) % 10];
            const chiYear = CHI[(y - 4) % 12];

            document.getElementById('detailPanel').innerHTML = `
                <div style="font-size:0.8rem; color:var(--gold); font-weight:700; text-transform:uppercase; letter-spacing:2px;">${dow}</div>
                <div class="big-solar">${d}</div>
                <div style="font-weight:600; margin-bottom:20px;">Tháng ${m}, ${y}</div>
                
                <div class="info-item"><span>Âm lịch</span><b>Ngày ${lunar.day} tháng ${lunar.month}</b></div>
                <div class="info-item"><span>Can Chi</span><b>Ngày ${canDay} ${chiDay}</b></div>
                <div class="info-item"><span>Năm</span><b>${canYear} ${chiYear}</b></div>
                <div class="info-item"><span>Giờ H.Đạo</span><b style="color:#10b981">Sửu, Thìn, Tỵ</b></div>
                <button class="btn-gold" style="margin-top:15px; font-size:0.7rem; padding:10px;" onclick="goToday()">Về Hôm Nay</button>
            `;
        }

        function getFortune() {
            const name = document.getElementById('userName').value;
            const dob = document.getElementById('userDob').value;

            if (!name || !dob) return alert("Vui lòng nhập đầy đủ thông tin để luận giải!");

            localStorage.setItem('p_name', name);
            localStorage.setItem('p_dob', dob);

            const results = [
                "Vận trình hôm nay Đại Cát. Công danh rạng rỡ, có quý nhân phương xa giúp đỡ. Tiền bạc hanh thông, nên mạnh dạn đầu tư.",
                "Quẻ chủ về Bình Hòa. Mọi việc nên giữ nguyên trạng, tránh thay đổi lớn. Chú ý sức khỏe, đặc biệt là các bệnh về đường tiêu hóa.",
                "Vận khí đang lên, tình duyên nảy nở. Người độc thân dễ gặp được ý trung nhân. Công việc có chút áp lực nhưng kết quả viên mãn.",
                "Cẩn trọng trong lời ăn tiếng nói, tránh thị phi tranh chấp. Hôm nay không nên cho vay mượn tiền bạc hay ký kết hợp đồng lớn.",
                "Quẻ Thiên Hỷ. Gia đạo có tin vui, con cái học hành tiến tới. Bản mệnh nên dành thời gian nghỉ ngơi, đi chùa cầu an."
            ];

            const seed = name.length + new Date(dob).getDate() + selectedDate.getDate();
            const resDiv = document.getElementById('fortuneRes');
            resDiv.style.display = 'block';
            resDiv.innerHTML = `<b>Lời sấm cho tuổi ${CHI[(new Date(dob).getFullYear() - 4) % 12]}:</b><br>${results[seed % results.length]}`;
        }

        function jump() {
            currentView.setMonth(parseInt(document.getElementById('mJump').value));
            currentView.setFullYear(parseInt(document.getElementById('yJump').value));
            render();
        }
        function changeMonth(s) { currentView.setMonth(currentView.getMonth() + s); render(); }
        function goToday() { currentView = new Date(); selectedDate = new Date(); render(); }

        init();
    </script>
</body>

</html>
