        </div>

    <div id="wish-box"></div>

    <script>
    (function () {
        function decodeKeypan(val) {
            if (!val) return val;
            if (typeof decompressWithDictionary === 'function') {
                return decompressWithDictionary(val);
            }
            if (typeof Keypans !== 'undefined' && typeof Keypans.decompressWithDictionary === 'function') {
                return Keypans.decompressWithDictionary(val);
            }
            return val;
        }

        const params = new URLSearchParams(window.location.search);
        const encodedData = params.get('d') || params.get('id');

        let titleText = 'Bó hoa tặng bạn';
        let letterHeading = 'Gửi bạn!';
        let letterBody = 'Chúc bạn một ngày thật vui vẻ và hạnh phúc!';
        let letterSign = '';
        let audioSrc = 'n/c.mp3';
        let introPrompt = 'Chạm vào hoa nhé';
        let introImage = './assets/a/anhz.png';

        if (encodedData && typeof LZString !== 'undefined') {
            try {
                const decompressed = LZString.decompressFromEncodedURIComponent(encodedData);
                if (decompressed) {
                    const parts = decompressed.split('|');
                    if (parts[0]) titleText = decodeKeypan(parts[0]) || titleText;
                    if (parts[1]) letterHeading = decodeKeypan(parts[1]) || letterHeading;
                    if (parts[2]) letterBody = decodeKeypan(parts[2]) || letterBody;
                    if (parts[3]) letterSign = decodeKeypan(parts[3]) || '';
                    if (parts[4]) audioSrc = parts[4];
                    if (parts[5]) introPrompt = decodeKeypan(parts[5]) || introPrompt;
                    if (parts[6]) introImage = parts[6] || introImage;
                }
            } catch (err) {
                console.error('Lỗi giải mã payload:', err);
            }
        }

        // Cập nhật DOM
        const specialTextEl = document.getElementById('special-text');
        if (specialTextEl) specialTextEl.textContent = titleText;

        const instructionTextEl = document.querySelector('.instruction-text');
        if (instructionTextEl) instructionTextEl.textContent = introPrompt;

        const giftImageEl = document.getElementById('btn-devpan');
        if (giftImageEl && introImage) giftImageEl.src = introImage;

        const letterContent = document.getElementById('letter-content');
        if (letterContent) {
            letterContent.innerHTML = '';
            const h2 = document.createElement('h2');
            h2.className = 'fade-in';
            h2.textContent = letterHeading;
            letterContent.appendChild(h2);

            const p = document.createElement('p');
            p.className = 'fade-in';
            p.textContent = letterBody;
            letterContent.appendChild(p);

            if (letterSign) {
                const signEl = document.createElement('div');
                signEl.className = 'letter-sign fade-in';
                signEl.textContent = letterSign;
                letterContent.appendChild(signEl);
            }

            const closeBtn = document.createElement('button');
            closeBtn.id = 'close-letter';
            closeBtn.className = 'close-letter-btn fade-in';
            closeBtn.textContent = '✕ Đóng thư';
            closeBtn.addEventListener('click', function (e) {
                e.stopPropagation();
                closeLetter();
            });
            closeBtn.addEventListener('touchstart', function (e) {
                e.stopPropagation();
                e.preventDefault();
                closeLetter();
            }, { passive: false });
            letterContent.appendChild(closeBtn);
        }

        function getAudioBlobFromIDB(id) {
            return new Promise(function(resolve) {
                if (!window.indexedDB) return resolve(null);
                var req = indexedDB.open('lkimlam_audio_db', 1);
                req.onerror = function() { resolve(null); };
                req.onsuccess = function(e) {
                    var db = e.target.result;
                    if (!db.objectStoreNames.contains('audios')) return resolve(null);
                    var tx = db.transaction('audios', 'readonly');
                    var store = tx.objectStore('audios');
                    var getReq = store.get(id);
                    getReq.onsuccess = function() {
                        if (getReq.result && getReq.result.blob) resolve(getReq.result.blob);
                        else resolve(null);
                    };
                    getReq.onerror = function() { resolve(null); };
                };
            });
        }

        async function resolveAudioStream(rawUrl) {
            if (!rawUrl) return './n/c.mp3';
            var trimmed = rawUrl.trim();
            if (trimmed.startsWith('idb:')) {
                try {
                    var blob = await getAudioBlobFromIDB(trimmed);
                    if (blob) return URL.createObjectURL(blob);
                } catch(e) {}
            }
            if (/^https?:\/\//i.test(trimmed)) {
                if (trimmed.includes('tmpfiles.org/') && !trimmed.includes('tmpfiles.org/dl/')) {
                    trimmed = trimmed.replace('tmpfiles.org/', 'tmpfiles.org/dl/');
                }
                try {
                    var cached = await getAudioBlobFromIDB(trimmed);
                    if (cached) return URL.createObjectURL(cached);
                } catch(e) {}
                return trimmed;
            }
            if (trimmed.startsWith('data:') || trimmed.startsWith('blob:') || trimmed.startsWith('./')) return trimmed;
            return './' + trimmed;
        }

        const audioEl = document.getElementById('audio-ms');
        if (audioEl && audioSrc) {
            resolveAudioStream(audioSrc).then(function(res) {
                audioEl.src = res;
            });
            audioEl.onerror = function() {
                if (audioEl.src !== './n/c.mp3') {
                    audioEl.src = './n/c.mp3';
                }
            };
        }

        // Tương tác chạm vào hoa (chú thỏ)
        const btnDevpan = document.getElementById('btn-devpan');
        let isStarted = false;

        function startExperience() {
            if (isStarted) return;
            isStarted = true;

            if (audioEl) {
                audioEl.currentTime = 0;
                audioEl.play().catch(function (e) {
                    console.log('Trình duyệt chặn tự động phát âm thanh:', e);
                });
            }

            const pantalla = document.getElementById('pantalla-inicial');
            if (pantalla) pantalla.style.display = 'none';

            const contenido = document.getElementById('contenido-principal');
            if (contenido) contenido.style.display = 'block';

            const ramo = document.querySelector('.ramo');
            if (ramo) ramo.classList.add('ramo--visible');

            const letterWrap = document.getElementById('letter-btn-wrap');
            if (letterWrap) letterWrap.style.display = 'flex';

            const btnLetter = document.getElementById('btn-letter');
            if (btnLetter) btnLetter.style.display = 'block';

            // Tự động mở bức thư sau 2.6s (khi hoa nở rộ xong) để người xem đọc ngay lời chúc
            setTimeout(function () {
                openLetter();
            }, 2600);
        }

        if (btnDevpan) {
            btnDevpan.addEventListener('click', startExperience);
            btnDevpan.addEventListener('touchstart', function(e) {
                e.preventDefault();
                startExperience();
            }, { passive: false });
        }

        // Mở & Đóng thư
        const btnLetter = document.getElementById('btn-letter');
        const letterWrap = document.getElementById('letter-btn-wrap');
        const letterBox = document.getElementById('letter-box');

        function openLetter() {
            if (letterBox) {
                letterBox.style.display = 'flex';
            }
        }

        function closeLetter() {
            if (letterBox) {
                letterBox.style.display = 'none';
            }
        }

        if (btnLetter) {
            btnLetter.addEventListener('click', openLetter);
            btnLetter.addEventListener('touchstart', function (e) {
                e.preventDefault();
                openLetter();
            }, { passive: false });
        }

        if (letterWrap) {
            letterWrap.addEventListener('click', openLetter);
            letterWrap.addEventListener('touchstart', function (e) {
                e.preventDefault();
                openLetter();
            }, { passive: false });
        }

        // Đóng thư khi nhấp ra ngoài hộp thư
        if (letterBox) {
            letterBox.addEventListener('click', closeLetter);
        }

        if (letterContent) {
            letterContent.addEventListener('click', function (e) {
                e.stopPropagation();
            });
            letterContent.addEventListener('touchstart', function (e) {
                e.stopPropagation();
            }, { passive: true });
        }
    })();
    </script>
