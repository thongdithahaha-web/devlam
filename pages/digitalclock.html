<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đồng Hồ Số - Digital Clock | DevPan</title>
    <link rel="icon" href="../assets/icon1.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --clock-color: #00f0ff;
            --glow-color: rgba(0, 240, 255, 0.4);
            --card-bg: rgba(17, 24, 39, 0.85);
            --border-color: rgba(255, 255, 255, 0.1);
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg-color);
            background-image: radial-gradient(circle at 50% 30%, rgba(99, 102, 241, 0.15), transparent 70%),
                              radial-gradient(circle at 80% 80%, rgba(236, 72, 153, 0.12), transparent 50%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-color);
            padding: 20px;
        }

        .header-bar {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn-back {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-color);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-back:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateX(-3px);
        }

        .color-pickers {
            display: flex;
            gap: 10px;
        }

        .color-dot {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
            transition: transform 0.2s;
        }

        .color-dot:hover {
            transform: scale(1.2);
        }

        .clock-container {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 28px;
            padding: 40px 50px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6), 0 0 40px var(--glow-color);
            backdrop-filter: blur(16px);
            text-align: center;
            max-width: 650px;
            width: 100%;
            transition: box-shadow 0.5s ease;
        }

        .date-display {
            font-size: 1.15rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 20px;
            font-weight: 600;
        }

        .time-display {
            font-family: 'Orbitron', monospace;
            font-size: clamp(2.5rem, 8vw, 5.2rem);
            font-weight: 900;
            color: var(--clock-color);
            text-shadow: 0 0 20px var(--glow-color), 0 0 40px var(--glow-color);
            letter-spacing: 4px;
            display: flex;
            justify-content: center;
            align-items: baseline;
            gap: 8px;
            user-select: none;
        }

        .ampm {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text-muted);
            margin-left: 10px;
        }

        .tabs-mode {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 30px;
        }

        .tab-btn {
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-muted);
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .tab-btn.active {
            background: var(--clock-color);
            color: #0b0f19;
            font-weight: 700;
            border-color: var(--clock-color);
            box-shadow: 0 0 15px var(--glow-color);
        }

        .stopwatch-controls {
            display: none;
            gap: 12px;
            justify-content: center;
            margin-top: 20px;
        }

        .btn-ctrl {
            padding: 10px 24px;
            border-radius: 12px;
            border: none;
            font-weight: 700;
            cursor: pointer;
            font-size: 0.95rem;
            transition: all 0.2s;
        }

        .btn-start { background: #10b981; color: white; }
        .btn-stop { background: #ef4444; color: white; }
        .btn-reset { background: rgba(255, 255, 255, 0.1); color: white; }

        @media (max-width: 600px) {
            .clock-container {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="header-bar">
        <a href="../index.html" class="btn-back">
            <i class="fa-solid fa-arrow-left"></i> Trang Chủ DevPan
        </a>
        <div class="color-pickers">
            <div class="color-dot" style="background: #00f0ff;" onclick="changeTheme('#00f0ff', 'rgba(0, 240, 255, 0.4)')" title="Cyan Neon"></div>
            <div class="color-dot" style="background: #ec4899;" onclick="changeTheme('#ec4899', 'rgba(236, 72, 153, 0.4)')" title="Pink Neon"></div>
            <div class="color-dot" style="background: #10b981;" onclick="changeTheme('#10b981', 'rgba(16, 185, 129, 0.4)')" title="Emerald Neon"></div>
            <div class="color-dot" style="background: #eab308;" onclick="changeTheme('#eab308', 'rgba(234, 179, 8, 0.4)')" title="Gold Neon"></div>
        </div>
    </div>

    <div class="clock-container" id="clockBox">
        <div class="date-display" id="dateText">ĐANG TẢI...</div>
        <div class="time-display">
            <span id="timeText">00:00:00</span>
            <span class="ampm" id="ampmText">AM</span>
        </div>

        <div class="tabs-mode">
            <button class="tab-btn active" id="tabClock" onclick="setMode('clock')"><i class="fa-solid fa-clock"></i> Đồng Hồ</button>
            <button class="tab-btn" id="tabStopwatch" onclick="setMode('stopwatch')"><i class="fa-solid fa-stopwatch"></i> Bấm Giờ</button>
        </div>

        <div class="stopwatch-controls" id="swControls">
            <button class="btn-ctrl btn-start" id="btnSwStart" onclick="startStopwatch()">Bắt đầu</button>
            <button class="btn-ctrl btn-reset" onclick="resetStopwatch()">Đặt lại</button>
        </div>
    </div>

    <script>
        let mode = 'clock';
        let swTime = 0;
        let swInterval = null;
        let swRunning = false;

        function updateClock() {
            if (mode !== 'clock') return;
            const now = new Date();
            const days = ['Chủ Nhật', 'Thứ Hai', 'Thứ Ba', 'Thứ Tư', 'Thứ Năm', 'Thứ Sáu', 'Thứ Bảy'];
            const dayName = days[now.getDay()];
            const d = String(now.getDate()).padStart(2, '0');
            const m = String(now.getMonth() + 1).padStart(2, '0');
            const y = now.getFullYear();
            document.getElementById('dateText').textContent = `${dayName}, ${d}/${m}/${y}`;

            let hours = now.getHours();
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12 || 12;
            const h = String(hours).padStart(2, '0');
            const min = String(now.getMinutes()).padStart(2, '0');
            const s = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('timeText').textContent = `${h}:${min}:${s}`;
            document.getElementById('ampmText').textContent = ampm;
        }

        setInterval(updateClock, 1000);
        updateClock();

        function setMode(m) {
            mode = m;
            document.getElementById('tabClock').classList.toggle('active', m === 'clock');
            document.getElementById('tabStopwatch').classList.toggle('active', m === 'stopwatch');
            document.getElementById('swControls').style.display = (m === 'stopwatch') ? 'flex' : 'none';

            if (m === 'clock') {
                updateClock();
            } else {
                document.getElementById('dateText').textContent = 'BẤM GIỜ THỜI GIAN';
                document.getElementById('ampmText').textContent = 'SW';
                updateSwDisplay();
            }
        }

        function updateSwDisplay() {
            const h = String(Math.floor(swTime / 3600000)).padStart(2, '0');
            const m = String(Math.floor((swTime % 3600000) / 60000)).padStart(2, '0');
            const s = String(Math.floor((swTime % 60000) / 1000)).padStart(2, '0');
            const ms = String(Math.floor((swTime % 1000) / 10)).padStart(2, '0');
            document.getElementById('timeText').textContent = `${m}:${s}:${ms}`;
        }

        function startStopwatch() {
            if (!swRunning) {
                swRunning = true;
                document.getElementById('btnSwStart').textContent = 'Tạm dừng';
                document.getElementById('btnSwStart').className = 'btn-ctrl btn-stop';
                const startTime = Date.now() - swTime;
                swInterval = setInterval(() => {
                    swTime = Date.now() - startTime;
                    updateSwDisplay();
                }, 30);
            } else {
                swRunning = false;
                clearInterval(swInterval);
                document.getElementById('btnSwStart').textContent = 'Tiếp tục';
                document.getElementById('btnSwStart').className = 'btn-ctrl btn-start';
            }
        }

        function resetStopwatch() {
            swRunning = false;
            clearInterval(swInterval);
            swTime = 0;
            document.getElementById('btnSwStart').textContent = 'Bắt đầu';
            document.getElementById('btnSwStart').className = 'btn-ctrl btn-start';
            updateSwDisplay();
        }

        function changeTheme(color, glow) {
            document.documentElement.style.setProperty('--clock-color', color);
            document.documentElement.style.setProperty('--glow-color', glow);
        }
    </script>
</body>
</html>
