<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hiệu Ứng Trái Tim Tình Yêu - Heart Animation | DevLam</title>
    <link rel="icon" href="../assets/icon1.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&family=Mali:wght@600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Mali', 'Plus Jakarta Sans', sans-serif;
            color: #fff;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .header-bar {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 20;
        }

        .btn-back {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            color: #fff;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            backdrop-filter: blur(8px);
            transition: all 0.3s ease;
        }

        .btn-back:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateX(-3px);
        }

        .heart-text {
            position: absolute;
            z-index: 10;
            text-align: center;
            pointer-events: none;
            text-shadow: 0 0 20px #ff2a6d, 0 0 40px #ff2a6d;
        }

        .heart-text h1 {
            font-size: clamp(1.8rem, 5vw, 3rem);
            font-weight: 700;
            color: #fff;
            margin-bottom: 8px;
        }

        .heart-text p {
            font-size: clamp(1rem, 3vw, 1.3rem);
            color: #ffb3c6;
        }
    </style>
</head>
<body>
    <div class="header-bar">
        <a href="../index.html" class="btn-back">
            <i class="fa-solid fa-arrow-left"></i> Trang Chủ DevLam
        </a>
    </div>

    <div class="heart-text">
        <h1 id="titleText">Yêu Em Rất Nhiều ❤️</h1>
        <p id="subText">Mãi bên nhau bạn nhé!</p>
    </div>

    <canvas id="heartCanvas"></canvas>

    <script>
        const canvas = document.getElementById('heartCanvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Heart mathematical function
        function heartPoint(t) {
            const x = 16 * Math.pow(Math.sin(t), 3);
            const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
            return { x, y };
        }

        const particles = [];
        const numParticles = 350;

        for (let i = 0; i < numParticles; i++) {
            const t = Math.random() * Math.PI * 2;
            const pt = heartPoint(t);
            particles.push({
                t: t,
                baseX: pt.x,
                baseY: pt.y,
                distance: 10 + Math.random() * 20,
                speed: 0.01 + Math.random() * 0.02,
                size: 1 + Math.random() * 2.5,
                alpha: 0.3 + Math.random() * 0.7,
                color: `hsl(${340 + Math.random() * 30}, 100%, ${60 + Math.random() * 20}%)`
            });
        }

        let scaleFactor = 1;
        let scaleDir = 0.008;

        function animate() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const cx = canvas.width / 2;
            const cy = canvas.height / 2;
            const scale = (Math.min(canvas.width, canvas.height) / 36) * scaleFactor;

            scaleFactor += scaleDir;
            if (scaleFactor > 1.15 || scaleFactor < 0.95) scaleDir = -scaleDir;

            particles.forEach(p => {
                p.t += p.speed;
                const pt = heartPoint(p.t);
                const jitter = (Math.random() - 0.5) * 8;
                const px = cx + pt.x * scale + jitter;
                const py = cy + pt.y * scale + jitter;

                ctx.beginPath();
                ctx.arc(px, py, p.size, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.shadowBlur = 15;
                ctx.shadowColor = p.color;
                ctx.fill();
            });

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
