<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vòng Quay Số May Mắn | DevLam</title>
    <link rel="icon" href="../assets/logo.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --accent-pink: #ec4899;
            --accent-purple: #8b5cf6;
            --border-color: rgba(255, 255, 255, 0.1);
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg-color);
            background-image: radial-gradient(circle at 50% 20%, rgba(139, 92, 246, 0.2), transparent 60%),
                              radial-gradient(circle at 80% 80%, rgba(236, 72, 153, 0.15), transparent 60%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-color);
            padding: 20px;
        }

        .header-bar {
            position: absolute;
            top: 20px;
            left: 20px;
        }

        .btn-back {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-color);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-back:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateX(-3px);
        }

        .wheel-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(17, 24, 39, 0.8);
            border: 1px solid var(--border-color);
            border-radius: 28px;
            padding: 30px 40px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(16px);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }

        h1 {
            font-size: 1.6rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ec4899, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 20px;
        }

        .wheel-container {
            position: relative;
            width: 320px;
            height: 320px;
            margin: 10px 0 25px;
        }

        .wheel-pointer {
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            width: 32px;
            height: 42px;
            z-index: 10;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.5));
        }

        .wheel-pointer::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 0;
            height: 0;
            border-left: 16px solid transparent;
            border-right: 16px solid transparent;
            border-top: 32px solid #f43f5e;
        }

        #wheelCanvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            box-shadow: 0 0 30px rgba(139, 92, 246, 0.4), inset 0 0 15px rgba(0,0,0,0.5);
            border: 4px solid rgba(255, 255, 255, 0.2);
            transition: transform 4s cubic-bezier(0.15, 0.95, 0.35, 1);
        }

        .spin-btn {
            padding: 14px 40px;
            background: linear-gradient(135deg, #ec4899, #8b5cf6);
            border: none;
            border-radius: 50px;
            color: #fff;
            font-size: 1.1rem;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(236, 72, 153, 0.4);
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .spin-btn:hover {
            transform: translateY(-2px) scale(1.03);
            box-shadow: 0 12px 30px rgba(236, 72, 153, 0.6);
        }

        .spin-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .result-box {
            margin-top: 20px;
            font-size: 1.1rem;
            font-weight: 700;
            color: #10b981;
            min-height: 28px;
        }
    </style>
</head>
<body>
    <div class="header-bar">
        <a href="../index.html" class="btn-back">
            <i class="fa-solid fa-arrow-left"></i> Trang Chủ DevLam
        </a>
    </div>

    <div class="wheel-wrapper">
        <h1>VÒNG QUAY SỐ MAY MẮN</h1>

        <div class="wheel-container">
            <div class="wheel-pointer"></div>
            <canvas id="wheelCanvas" width="600" height="600"></canvas>
        </div>

        <button class="spin-btn" id="spinBtn" onclick="spinWheel()">QUAY NGAY 🎯</button>
        <div class="result-box" id="resultText"></div>
    </div>

    <script>
        const canvas = document.getElementById('wheelCanvas');
        const ctx = canvas.getContext('2d');
        const items = ['Số 1', 'Số 2', 'Số 3', 'Số 4', 'Số 5', 'Số 6', 'Số 7', 'Số 8'];
        const colors = ['#f43f5e', '#8b5cf6', '#06b6d4', '#10b981', '#f59e0b', '#ec4899', '#3b82f6', '#6366f1'];
        const numSegments = items.length;
        const arc = (2 * Math.PI) / numSegments;
        let currentRotation = 0;
        let isSpinning = false;

        function drawWheel() {
            ctx.clearRect(0, 0, 600, 600);
            const cx = 300, cy = 300, r = 290;

            for (let i = 0; i < numSegments; i++) {
                const angle = i * arc;
                ctx.beginPath();
                ctx.fillStyle = colors[i % colors.length];
                ctx.moveTo(cx, cy);
                ctx.arc(cx, cy, r, angle, angle + arc);
                ctx.lineTo(cx, cy);
                ctx.fill();
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 3;
                ctx.stroke();

                ctx.save();
                ctx.translate(cx, cy);
                ctx.rotate(angle + arc / 2);
                ctx.textAlign = 'right';
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 30px "Plus Jakarta Sans", sans-serif';
                ctx.fillText(items[i], r - 35, 10);
                ctx.restore();
            }

            // Center circle
            ctx.beginPath();
            ctx.arc(cx, cy, 45, 0, 2 * Math.PI);
            ctx.fillStyle = '#0b0f19';
            ctx.fill();
            ctx.strokeStyle = '#8b5cf6';
            ctx.lineWidth = 5;
            ctx.stroke();

            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 20px "Plus Jakarta Sans"';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('DevLam', cx, cy);
        }

        drawWheel();

        function spinWheel() {
            if (isSpinning) return;
            isSpinning = true;
            document.getElementById('spinBtn').disabled = true;
            document.getElementById('resultText').textContent = 'Đang quay... 🎲';

            const extraDegrees = Math.floor(Math.random() * 360);
            const totalRounds = 5 + Math.floor(Math.random() * 4);
            const targetRotation = currentRotation + (totalRounds * 360) + extraDegrees;

            canvas.style.transform = `rotate(${targetRotation}deg)`;
            currentRotation = targetRotation;

            setTimeout(() => {
                isSpinning = false;
                document.getElementById('spinBtn').disabled = false;
                const normalizedAngle = (360 - (targetRotation % 360) + 270) % 360;
                const index = Math.floor(normalizedAngle / (360 / numSegments)) % numSegments;
                document.getElementById('resultText').textContent = `🎉 Chúc mừng bạn đã trúng: ${items[index]}!`;
            }, 4200);
        }
    </script>
</body>
</html>
