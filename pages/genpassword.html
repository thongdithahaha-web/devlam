<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Trình tạo mật khẩu</title>
    <link rel="icon" href="../assets/logo.png" type="image/png">
    <link
        href="https://fonts.googleapis.com/css2?family=Mali:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700;1,200;1,300;1,400;1,500;1,600;1,700&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --primary-color: #092c42;
            --primary-color-hover: #144b6d;
            --bg-gradient-start: #e0eafc;
            --bg-gradient-end: #cfdef3;
            --white: #ffffff;
            --text-dark: #333;
            --text-light: #777;
            --text-contrast: #111;
            --box-shadow: 0 15px 30px rgba(0, 0, 0, 0.08);
            --border-radius: 16px;
            --font-size-base: 16px;
            --font-size-lg: 18px;
            --font-size-xl: 22px;
            --font-size-x: 10px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            margin: 0;
            height: 100%;
        }

        body {
            font-family: "Mali", cursive;
            background: linear-gradient(135deg, var(--bg-gradient-start), var(--bg-gradient-end));
            display: flex;
            justify-content: flex-start;
            align-items: center;
            flex-direction: column;
            padding: 30px 20px 0;
            min-height: 100vh;
        }

        .container {
            flex-grow: 1;
        }

        .container {
            flex-grow: 1;
            background: var(--white);
            /* border-radius: var(--border-radius); */
            box-shadow: var(--box-shadow);
            max-width: 420px;
            width: 100%;
            padding: 30px 35px;
            display: flex;
            flex-direction: column;
        }

        h2 {
            text-align: center;
            font-weight: 800;
            font-size: var(--font-size-xl);
            color: var(--text-dark);
            margin-bottom: var(--font-size-xl);
        }

        #password {
            width: 100%;
            padding: 14px 18px;
            font-size: var(--font-size-xl);
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            background: #f9fafb;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-weight: 600;
            color: var(--text-contrast);
            text-align: center;
            user-select: all;
            word-break: break-word;
            transition: border-color 0.25s ease;
            margin-bottom: var(--font-size-xl);
        }

        #password:hover {
            border-color: #a0a0a0;
        }

        #strength,
        #crack-time {
            font-size: 14px;
            color: #444;
            text-align: center;
            font-weight: 500;
            margin-bottom: var(--font-size-x);
        }

        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 5px;
            margin-bottom: var(--font-size-x);
        }

        .button-group button {
            flex: 1;
            padding: 12px;
            background-color: var(--primary-color);
            color: var(--white);
            border: none;
            border-radius: 10px;
            font-size: var(--font-size-base);
            cursor: pointer;
            box-shadow: 0 6px 12px rgba(79, 70, 229, 0.4);
            transition: background-color 0.3s ease, transform 0.15s ease;
            user-select: none;
            font-family: "Mali", cursive;
        }

        .button-group button:hover {
            background-color: var(--primary-color-hover);
            transform: translateY(-2px);
        }

        .button-group button:active {
            transform: translateY(0);
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 18px;
            font-size: var(--font-size-base);
            color: var(--text-dark);
        }

        .length-control {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .length-control label {
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            user-select: none;
        }

        #lengthNumber {
            width: 60px;
            padding: 6px 8px;
            font-size: 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
            outline: none;
            text-align: center;
            transition: border-color 0.25s ease;
        }

        #lengthNumber:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 8px rgba(79, 70, 229, 0.5);
        }

        #lengthRange {
            width: 100%;
            accent-color: var(--primary-color);
            cursor: pointer;
        }

        .length-display {
            font-size: 14px;
            text-align: right;
            color: var(--text-light);
            user-select: none;
        }

        label.control-checkbox {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 500;
            cursor: pointer;
            user-select: none;
        }

        input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: var(--primary-color);
            border-radius: 5px;
            border: 1px solid #bbb;
            transition: border-color 0.3s ease;
        }

        input[type="checkbox"]:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 5px rgba(79, 70, 229, 0.6);
        }

        .footer {
            margin-top: 20px;
            padding: 12px 0;
            text-align: center;
            font-size: var(--font-size-lg);
            color: var(--text-light);
            border-radius: 0 0 var(--border-radius) var(--border-radius);
            user-select: none;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .container {
                padding: 25px 20px;
            }

            #password {
                font-size: 16px;
                padding: 12px 14px;
            }

            .button-group button {
                font-size: 14px;
                padding: 10px;
            }

            #lengthNumber {
                width: 50px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>Trình tạo mật khẩu</h2>

        <div id="strength">Mức độ an toàn: <strong>?</strong></div>
        <div id="crack-time">Thời gian phá mật khẩu ước tính: <strong>?</strong></div>

        <div id="password" title="Nhấn để sao chép mật khẩu">Mật khẩu sẽ hiện ở đây</div>

        <div class="button-group">
            <button onclick="copyPassword()">Sao chép</button>
            <button onclick="generatePassword()">Tạo lại</button>
            <button onclick="downloadPassword()">Tải về</button>
        </div>

        <div class="controls">
            <div class="length-control">
                <label for="lengthNumber">Độ dài mật khẩu:
                    <input type="number" id="lengthNumber" min="4" max="50" value="12" />
                </label>
                <input type="range" id="lengthRange" min="4" max="50" value="12" />
                <div class="length-display">Độ dài: <span id="lengthValue">12</span>/50</div>
            </div>

            <label class="control-checkbox" for="uppercase">
                <input type="checkbox" id="uppercase" checked />
                <span>Ký tự in hoa (A-Z)</span>
            </label>
            <label class="control-checkbox" for="lowercase">
                <input type="checkbox" id="lowercase" checked />
                <span>Ký tự thường (a-z)</span>
            </label>
            <label class="control-checkbox" for="numbers">
                <input type="checkbox" id="numbers" checked />
                <span>Số (0-9)</span>
            </label>
            <label class="control-checkbox" for="symbols">
                <input type="checkbox" id="symbols" checked />
                <span>Ký tự đặc biệt (!@#...)</span>
            </label>
        </div>
    </div>

    <footer class="footer">
        <p>© 2026 devlekimlam. Trình tạo mật khẩu.</p>
    </footer>
    <script src="../assets/js/genpass.js"></script>
</body>


</html>
