<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đếm Ngày Yêu - Love Days Counter | DevLam</title>
    <link rel="icon" href="../assets/icon1.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Mali:wght@500;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --accent-pink: #ec4899;
            --accent-purple: #8b5cf6;
            --border-color: rgba(255, 255, 255, 0.1);
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Mali', 'Plus Jakarta Sans', sans-serif;
            background: var(--bg-color);
            background-image: radial-gradient(circle at 50% 20%, rgba(236, 72, 153, 0.25), transparent 60%),
                              radial-gradient(circle at 80% 80%, rgba(139, 92, 246, 0.2), transparent 60%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-color);
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        .header-bar {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 20;
        }

        .btn-back {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-color);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-back:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateX(-3px);
        }

        .love-container {
            background: rgba(17, 24, 39, 0.85);
            border: 1px solid var(--border-color);
            border-radius: 32px;
            padding: 35px 40px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6), 0 0 30px rgba(236, 72, 153, 0.2);
            backdrop-filter: blur(16px);
            text-align: center;
            max-width: 520px;
            width: 100%;
            z-index: 10;
        }

        .couple-avatars {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-bottom: 25px;
        }

        .avatar-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .avatar-img {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--accent-pink);
            box-shadow: 0 0 20px rgba(236, 72, 153, 0.4);
        }

        .couple-heart {
            font-size: 2.2rem;
            color: #ef4444;
            animation: beat 1s infinite alternate ease-in-out;
        }

        @keyframes beat {
            0% { transform: scale(0.9); }
            100% { transform: scale(1.2); }
        }

        .partner-name {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-color);
            border: none;
            background: transparent;
            text-align: center;
            outline: none;
            width: 120px;
            border-bottom: 1px dashed rgba(255, 255, 255, 0.3);
            font-family: inherit;
        }

        .days-box {
            margin: 20px 0;
            background: rgba(236, 72, 153, 0.1);
            border: 1px solid rgba(236, 72, 153, 0.3);
            border-radius: 20px;
            padding: 20px;
        }

        .days-count {
            font-size: clamp(3rem, 10vw, 4.5rem);
            font-weight: 900;
            color: #f43f5e;
            text-shadow: 0 0 25px rgba(244, 63, 94, 0.6);
            line-height: 1;
        }

        .days-label {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-muted);
            margin-top: 8px;
        }

        .time-detail {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-top: 15px;
            font-size: 0.95rem;
            color: var(--text-muted);
        }

        .time-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 8px 12px;
            border-radius: 10px;
            font-weight: 600;
        }

        .time-item strong {
            color: var(--accent-pink);
        }

        .date-picker-wrap {
            margin-top: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .date-input {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: #fff;
            padding: 8px 12px;
            font-family: inherit;
            outline: none;
        }

        .floating-heart {
            position: absolute;
            color: rgba(236, 72, 153, 0.6);
            pointer-events: none;
            animation: floatUp 4s linear infinite;
        }

        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0.5); opacity: 0; }
            50% { opacity: 0.8; }
            100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="header-bar">
        <a href="../index.html" class="btn-back">
            <i class="fa-solid fa-arrow-left"></i> Trang Chủ DevLam
        </a>
    </div>

    <div class="love-container">
        <div class="couple-avatars">
            <div class="avatar-wrap">
                <img src="https://api.dicebear.com/7.x/adventurer/svg?seed=Romeo" alt="Boy" class="avatar-img" />
                <input type="text" class="partner-name" id="name1" value="Anh" onchange="saveData()" />
            </div>

            <div class="couple-heart">
                <i class="fa-solid fa-heart"></i>
            </div>

            <div class="avatar-wrap">
                <img src="https://api.dicebear.com/7.x/adventurer/svg?seed=Juliet" alt="Girl" class="avatar-img" />
                <input type="text" class="partner-name" id="name2" value="Em" onchange="saveData()" />
            </div>
        </div>

        <div class="days-box">
            <div class="days-count" id="daysNum">0</div>
            <div class="days-label">NGÀY BÊN NHAU 💖</div>
        </div>

        <div class="time-detail">
            <div class="time-item"><strong id="hoursNum">0</strong> giờ</div>
            <div class="time-item"><strong id="minsNum">0</strong> phút</div>
            <div class="time-item"><strong id="secsNum">0</strong> giây</div>
        </div>

        <div class="date-picker-wrap">
            <label for="startDate">Ngày bắt đầu yêu:</label>
            <input type="date" id="startDate" class="date-input" onchange="saveData()" />
        </div>
    </div>

    <script>
        // Load stored data
        let savedDate = localStorage.getItem('devlam_love_date') || '2023-01-01';
        let savedName1 = localStorage.getItem('devlam_love_n1') || 'Anh';
        let savedName2 = localStorage.getItem('devlam_love_n2') || 'Em';

        document.getElementById('startDate').value = savedDate;
        document.getElementById('name1').value = savedName1;
        document.getElementById('name2').value = savedName2;

        function saveData() {
            const dateVal = document.getElementById('startDate').value;
            const n1 = document.getElementById('name1').value;
            const n2 = document.getElementById('name2').value;
            localStorage.setItem('devlam_love_date', dateVal);
            localStorage.setItem('devlam_love_n1', n1);
            localStorage.setItem('devlam_love_n2', n2);
            updateTimer();
        }

        function updateTimer() {
            const startStr = document.getElementById('startDate').value;
            if (!startStr) return;
            const start = new Date(startStr);
            const now = new Date();
            const diffMs = now - start;

            if (diffMs < 0) {
                document.getElementById('daysNum').textContent = '0';
                document.getElementById('hoursNum').textContent = '0';
                document.getElementById('minsNum').textContent = '0';
                document.getElementById('secsNum').textContent = '0';
                return;
            }

            const days = Math.floor(diffMs / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diffMs / (1000 * 60 * 60)) % 24);
            const mins = Math.floor((diffMs / (1000 * 60)) % 60);
            const secs = Math.floor((diffMs / 1000) % 60);

            document.getElementById('daysNum').textContent = days;
            document.getElementById('hoursNum').textContent = hours;
            document.getElementById('minsNum').textContent = mins;
            document.getElementById('secsNum').textContent = secs;
        }

        setInterval(updateTimer, 1000);
        updateTimer();

        // Floating hearts
        setInterval(() => {
            const heart = document.createElement('div');
            heart.className = 'floating-heart';
            heart.innerHTML = '<i class="fa-solid fa-heart"></i>';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.fontSize = (14 + Math.random() * 22) + 'px';
            heart.style.animationDuration = (3 + Math.random() * 3) + 's';
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 6000);
        }, 500);
    </script>
</body>
</html>
