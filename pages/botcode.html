<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="devlekimlam">
    <meta name="description" content="BotPan Code - Trình soạn thảo và chạy mã trực tiếp." />
    <title>BotPan Code - Trình Soạn Thảo Code Trực Tiếp</title>
    <link rel="icon" href="../assets/logo.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Playpen+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            border: 0;
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Playpen Sans', cursive, sans-serif;
        }

        :root {
            --bg-dark: #0f172a;
            --header-bg: #1e293b;
            --accent: #38bdf8;
            --text-color: #f1f5f9;
        }

        body {
            display: flex;
            height: 100vh;
            background-color: var(--bg-dark);
            color: var(--text-color);
            overflow: hidden;
            flex-direction: column;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 20px;
            background-color: var(--header-bg);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .header-title {
            font-size: 1.3rem;
            font-weight: 800;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header-actions {
            display: flex;
            gap: 10px;
        }

        button {
            background-color: #334155;
            color: #fff;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        button:hover {
            background-color: #475569;
            transform: translateY(-1px);
        }

        button.btn-primary {
            background: linear-gradient(135deg, #0284c7, #38bdf8);
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.3);
        }

        button.btn-primary:hover {
            background: linear-gradient(135deg, #0369a1, #0284c7);
        }

        .main-workspace {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .editor-side {
            flex: 1;
            display: flex;
            position: relative;
            background: #020617;
            border-right: 1px solid rgba(255, 255, 255, 0.1);
        }

        .line-numbers {
            width: 45px;
            background: #090d16;
            color: #64748b;
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            line-height: 22px;
            padding: 12px 6px;
            text-align: right;
            user-select: none;
            overflow: hidden;
            border-right: 1px solid rgba(255, 255, 255, 0.05);
        }

        textarea#code-editor {
            flex: 1;
            background: transparent;
            color: #e2e8f0;
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            line-height: 22px;
            padding: 12px;
            resize: none;
            outline: none;
            white-space: pre;
            overflow: auto;
            tab-size: 4;
        }

        .preview-side {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #ffffff;
        }

        iframe#preview-frame {
            width: 100%;
            height: 100%;
            border: none;
            background: #fff;
        }

        /* Chat Bot Assistant */
        .chat-button {
            position: fixed;
            bottom: 25px;
            right: 25px;
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #ec4899, #8b5cf6);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            color: white;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(236, 72, 153, 0.4);
            transition: all 0.3s ease;
            z-index: 99;
        }

        .chat-button:hover {
            transform: scale(1.1);
        }

        .chat-popup {
            position: fixed;
            bottom: 85px;
            right: 25px;
            width: 320px;
            background: #1e293b;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            display: none;
            flex-direction: column;
            gap: 10px;
            z-index: 100;
        }

        .chat-popup.show {
            display: flex;
        }

        .chat-popup h3 {
            font-size: 1rem;
            color: #38bdf8;
        }

        .chat-popup textarea {
            width: 100%;
            height: 80px;
            background: #0f172a;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 8px 12px;
            color: #fff;
            font-size: 13px;
            resize: none;
            outline: none;
        }

        @media (max-width: 768px) {
            .main-workspace {
                flex-direction: column;
            }
            .editor-side, .preview-side {
                flex: none;
                height: 50%;
            }
        }
    </style>
</head>

<body>
    <header>
        <div class="header-title">
            <span>🤖 BotPan Code Live Editor</span>
        </div>
        <div class="header-actions">
            <input type="file" id="file-input" accept=".html,.htm,.txt" style="display: none;" onchange="handleFileOpen(event)">
            <button onclick="document.getElementById('file-input').click()">📁 Mở File</button>
            <button class="btn-primary" onclick="runCode()">▶ Chạy Mã</button>
            <button onclick="saveFile()">💾 Lưu File</button>
            <a href="../index.html" style="color: #94a3b8; text-decoration: none; align-self: center; font-size: 13px; margin-left: 10px;">Về trang chủ</a>
        </div>
    </header>

    <div class="main-workspace">
        <div class="editor-side">
            <div class="line-numbers" id="line-numbers">1</div>
            <textarea id="code-editor" spellcheck="false" placeholder="Nhập mã HTML/CSS/JS vào đây..."><!DOCTYPE html>
<html>
<head>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
            background: linear-gradient(135deg, #fbc2eb 0%, #a6c1ee 100%);
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        h1 { color: #d63384; }
        p { font-size: 18px; color: #495057; }
        .heart { font-size: 50px; animation: beat 1s infinite alternate; }
        @keyframes beat { from { transform: scale(1); } to { transform: scale(1.2); } }
    </style>
</head>
<body>
    <div class="heart">💖</div>
    <h1>Chào mừng bạn đến với BotPan Code!</h1>
    <p>Chỉnh sửa mã bên trái và nhấn 'Chạy Mã' để xem kết quả.</p>
</body>
</html></textarea>
        </div>

        <div class="preview-side">
            <iframe id="preview-frame"></iframe>
        </div>
    </div>

    <!-- Chat Bot Assistant -->
    <div class="chat-button" onclick="toggleChat()">🤖</div>
    <div class="chat-popup" id="chat-popup">
        <h3>Trợ lý tạo code mẫu</h3>
        <p style="font-size: 12px; color: #94a3b8;">Chọn mẫu nhanh hoặc nhập yêu cầu:</p>
        <div style="display: flex; gap: 6px; flex-wrap: wrap;">
            <button style="padding: 4px 8px; font-size: 11px;" onclick="loadTemplate('heart')">Trái tim bay</button>
            <button style="padding: 4px 8px; font-size: 11px;" onclick="loadTemplate('flower')">Hoa nở</button>
            <button style="padding: 4px 8px; font-size: 11px;" onclick="loadTemplate('countdown')">Đếm ngược</button>
        </div>
        <textarea id="chat-prompt" placeholder="Mô tả ý tưởng muốn viết..."></textarea>
        <button class="btn-primary" onclick="generateCodeFromPrompt()">Chèn mã mẫu</button>
    </div>

    <script>
        const editor = document.getElementById('code-editor');
        const lineNumbers = document.getElementById('line-numbers');
        const preview = document.getElementById('preview-frame');

        function updateLineNumbers() {
            const lines = editor.value.split('\n').length;
            let nums = '';
            for (let i = 1; i <= lines; i++) {
                nums += i + '\n';
            }
            lineNumbers.textContent = nums;
        }

        editor.addEventListener('input', updateLineNumbers);
        editor.addEventListener('scroll', () => {
            lineNumbers.scrollTop = editor.scrollTop;
        });

        // Tab key indentation support
        editor.addEventListener('keydown', (e) => {
            if (e.key === 'Tab') {
                e.preventDefault();
                const start = editor.selectionStart;
                const end = editor.selectionEnd;
                editor.value = editor.value.substring(0, start) + '    ' + editor.value.substring(end);
                editor.selectionStart = editor.selectionEnd = start + 4;
            }
        });

        function runCode() {
            const content = editor.value;
            const doc = preview.contentDocument || preview.contentWindow.document;
            doc.open();
            doc.write(content);
            doc.close();
        }

        function handleFileOpen(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                editor.value = e.target.result;
                updateLineNumbers();
                runCode();
            };
            reader.readAsText(file);
        }

        function saveFile() {
            const blob = new Blob([editor.value], { type: 'text/html;charset=utf-8' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'index.html';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        function toggleChat() {
            document.getElementById('chat-popup').classList.toggle('show');
        }

        function loadTemplate(type) {
            if (type === 'heart') {
                editor.value = `<!DOCTYPE html>
<html>
<head>
<style>
body { background: #000; margin: 0; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; }
.heart { position: relative; width: 100px; height: 90px; animation: pulse 1s infinite alternate; }
.heart::before, .heart::after { content: ""; position: absolute; left: 50px; top: 0; width: 50px; height: 80px; background: #ff2a6d; border-radius: 50px 50px 0 0; transform: rotate(-45deg); transform-origin: 0 100%; }
.heart::after { left: 0; transform: rotate(45deg); transform-origin: 100% 100%; }
@keyframes pulse { from { transform: scale(1); } to { transform: scale(1.3); } }
</style>
</head>
<body>
<div class="heart"></div>
</body>
</html>`;
            } else if (type === 'flower') {
                editor.value = `<!DOCTYPE html>
<html>
<head>
<style>
body { background: #1a1a2e; color: #fff; text-align: center; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; margin: 0; }
.flower { font-size: 80px; animation: bloom 2s ease infinite alternate; }
@keyframes bloom { from { transform: rotate(0deg) scale(0.8); } to { transform: rotate(20deg) scale(1.2); } }
</style>
</head>
<body>
<div class="flower">🌸</div>
<h2>Bó hoa dành tặng người thương</h2>
</body>
</html>`;
            } else if (type === 'countdown') {
                editor.value = `<!DOCTYPE html>
<html>
<head>
<style>
body { background: #111; color: #ff758c; font-family: sans-serif; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; margin: 0; }
#timer { font-size: 48px; font-weight: bold; margin-top: 20px; }
</style>
</head>
<body>
<h1>Đếm Ngược Khoảnh Khắc</h1>
<div id="timer">00:00:00</div>
<script>
setInterval(() => {
    const now = new Date();
    document.getElementById('timer').innerText = now.toLocaleTimeString();
}, 1000);
<\/script>
</body>
</html>`;
            }
            updateLineNumbers();
            runCode();
            toggleChat();
        }

        function generateCodeFromPrompt() {
            const prompt = document.getElementById('chat-prompt').value.trim();
            if (!prompt) return;
            editor.value = `<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>${prompt}</title>
<style>
body {
    background: #0f172a;
    color: #f8fafc;
    font-family: sans-serif;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
}
.box {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 20px;
    padding: 40px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
}
h1 { color: #38bdf8; }
</style>
</head>
<body>
<div class="box">
    <h1>✨ ${prompt} ✨</h1>
    <p>Trang web tạo bởi BotPan theo yêu cầu của bạn!</p>
</div>
</body>
</html>`;
            updateLineNumbers();
            runCode();
            toggleChat();
        }

        // Initialize on page load
        updateLineNumbers();
        runCode();
    </script>
</body>
</html>
