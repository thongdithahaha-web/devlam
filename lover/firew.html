<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Chúc Mừng Năm Mới</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <link href="https://fonts.googleapis.com/css?family=Russo+One" rel="stylesheet">
  <link rel="icon" href="../assets/logo.png" type="image/png">
  <link rel="stylesheet" href="./css/reset.min.css">
  <link rel="stylesheet" href="./css/style.css">

</head>

<body>

      </symbol>
      <symbol id="icon-close" viewBox="0 0 24 24">
        <path
          d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z" />
      </symbol>
      <symbol id="icon-settings" viewBox="0 0 24 24">
        <path
          d="M19.43 12.98c.04-.32.07-.64.07-.98s-.03-.66-.07-.98l2.11-1.65c.19-.15.24-.42.12-.64l-2-3.46c-.12-.22-.39-.3-.61-.22l-2.49 1c-.52-.4-1.08-.73-1.69-.98l-.38-2.65C14.46 2.18 14.25 2 14 2h-4c-.25 0-.46.18-.49.42l-.38 2.65c-.61.25-1.17.59-1.69.98l-2.49-1c-.23-.09-.49 0-.61.22l-2 3.46c-.13.22-.07.49.12.64l2.11 1.65c-.04.32-.07.65-.07.98s.03.66.07.98l-2.11 1.65c-.19.15-.24.42-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1c.52.4 1.08.73 1.69.98l.38 2.65c.03.24.24.42.49.42h4c.25 0 .46-.18.49-.42l.38-2.65c.61-.25 1.17-.59 1.69-.98l2.49 1c.23.09.49 0 .61-.22l2-3.46c.12-.22.07-.49-.12-.64l-2.11-1.65zM12 15.5c-1.93 0-3.5-1.57-3.5-3.5s1.57-3.5 3.5-3.5 3.5 1.57 3.5 3.5-1.57 3.5-3.5 3.5z" />
      </symbol>
      <symbol id="icon-sound-on" viewBox="0 0 24 24">
        <path
          d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z" />
      </symbol>
      <symbol id="icon-sound-off" viewBox="0 0 24 24">
        <path
          d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z" />
      </symbol>
    </svg>
  </div>

  <div class="container">
    <div class="loading-init">
      <div class="loading-init__header">Loading</div>
      <div class="loading-init__status"> </div>
    </div>
    <div class="stage-container remove">
      <div class="canvas-container">
        <canvas id="trails-canvas"></canvas>
        <canvas id="main-canvas"></canvas>
      </div>
      <div class="controls">
        <div class="btn pause-btn">
          <svg fill="white" width="24" height="24">
            <use href="#icon-pause" xlink:href="#icon-pause"></use>
          </svg>
        </div>
        <div class="btn sound-btn">
          <svg fill="white" width="24" height="24">
            <use href="#icon-sound-off" xlink:href="#icon-sound-off"></use>
          </svg>
        </div>
        <div class="btn settings-btn">
          <svg fill="white" width="24" height="24">
            <use href="#icon-settings" xlink:href="#icon-settings"></use>
          </svg>
        </div>
      </div>
      <div class="menu hide">
        <div class="menu__inner-wrap">
          <div class="btn btn--bright close-menu-btn">
            <svg fill="white" width="24" height="24">
              <use href="#icon-close" xlink:href="#icon-close"></use>
            </svg>
          </div>
          <div class="menu__header">Settings</div>
          <div class="menu__subheader">For more info, click any label.</div>
          <form>
            <div class="form-option form-option--select">
              <label class="shell-type-label">Shell Type</label>
              <select class="shell-type"></select>
            </div>
            <div class="form-option form-option--select">
              <label class="shell-size-label">Shell Size</label>
              <select class="shell-size"></select>
            </div>
            <div class="form-option form-option--select">
              <label class="quality-ui-label">Quality</label>
              <select class="quality-ui"></select>
            </div>
            <div class="form-option form-option--select">
              <label class="sky-lighting-label">Sky Lighting</label>
              <select class="sky-lighting"></select>
            </div>
            <div class="form-option form-option--select">
              <label class="scaleFactor-label">Scale</label>
              <select class="scaleFactor"></select>
            </div>
            <div class="form-option form-option--checkbox">
              <label class="auto-launch-label">Auto Fire</label>
              <input class="auto-launch" type="checkbox" />
            </div>
            <div class="form-option form-option--checkbox form-option--finale-mode">
              <label class="finale-mode-label">Finale Mode</label>
              <input class="finale-mode" type="checkbox" />
            </div>
            <div class="form-option form-option--checkbox">
              <label class="hide-controls-label">Hide Controls</label>
              <input class="hide-controls" type="checkbox" />
            </div>
            <div class="form-option form-option--checkbox form-option--fullscreen">
              <label class="fullscreen-label">Fullscreen</label>
              <input class="fullscreen" type="checkbox" />
            </div>
            <div class="form-option form-option--checkbox">
              <label class="long-exposure-label">Open Shutter</label>
              <input class="long-exposure" type="checkbox" />
            </div>
          </form>
          <div class="credits">
            Passionately built by Caleb Miller.
          </div>
        </div>
      </div>
    </div>
    <div class="help-modal">
      <div class="help-modal__overlay"></div>
      <div class="help-modal__dialog">
        <div class="help-modal__header"></div>
        <div class="help-modal__body"></div>
        <button type="button" class="help-modal__close-btn">Close</button>
      </div>
    </div>
  </div>

  <!-- Message & Music Overlay -->
  <div id="firew-overlay" style="position:fixed; top:25px; left:50%; transform:translateX(-50%); z-index:99999; text-align:center; max-width:92%; width:440px; pointer-events:none;">
    <div id="firew-card" style="background:rgba(255,255,255,0.9); backdrop-filter:blur(10px); padding:16px 22px; border-radius:20px; box-shadow:0 12px 35px rgba(0,0,0,0.35); pointer-events:auto; border:1.8px solid #ff758f; animation:fadeIn 0.5s ease;">
      <h2 id="firew-title" style="margin:0; font-family:'Mali',sans-serif; color:#ff4d6d; font-size:19px; font-weight:700;">Pháo Hoa Rực Rỡ ✨</h2>
      <div id="firew-msg" style="margin-top:8px; font-family:'Mali',sans-serif; color:#333; font-size:14px; line-height:1.6; max-height:180px; overflow-y:auto; text-align:center;"></div>
      <div id="firew-photos" style="display:flex; gap:8px; justify-content:center; margin-top:10px; flex-wrap:wrap;"></div>
      <div style="margin-top:12px; display:flex; justify-content:center; gap:8px;">
        <button id="firew-music-btn" style="background:linear-gradient(45deg,#ff4d6d,#ff758f); color:#fff; border:none; border-radius:12px; padding:7px 16px; font-size:12.5px; font-weight:700; cursor:pointer; box-shadow:0 4px 10px rgba(255,77,109,0.3); transition:0.2s;">
          ▶️ Bật Nhạc
        </button>
        <button id="firew-toggle-card" style="background:#fff; color:#ff4d6d; border:1.5px solid #ff4d6d; border-radius:12px; padding:7px 14px; font-size:12.5px; font-weight:700; cursor:pointer;">
          Ẩn bảng tin
        </button>
      </div>
    </div>
  </div>

  <audio id="firew-audio" loop preload="auto"></audio>

  <script src='./js/fscreen.js'></script>
  <script src="./js/Stage.js"></script>
  <script src='./js/MyMath.js'></script>
  <script src='./js/script.js'></script>

  <!-- URL Payload & Audio Resolver -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.5.0/lz-string.min.js"></script>
  <script src="../assets/keypan.js"></script>
  <script>
    (function() {
      function getAudioBlobFromIDB(id) {
        return new Promise(function(resolve) {
          if (!window.indexedDB) return resolve(null);
          var req = indexedDB.open('lkimlam_audio_db', 1);
          req.onerror = function() { resolve(null); };
          req.onsuccess = function(e) {
            var db = e.target.result;
            if (!db.objectStoreNames.contains('audios')) return resolve(null);
            var tx = db.transaction('audios', 'readonly');
            var store = tx.objectStore('audios');
            var getReq = store.get(id);
            getReq.onsuccess = function() {
              if (getReq.result && getReq.result.blob) resolve(getReq.result.blob);
              else resolve(null);
            };
            getReq.onerror = function() { resolve(null); };
          };
        });
      }

      async function resolveAudioStream(rawUrl) {
        if (!rawUrl) return '../n/c.mp3';
        var trimmed = rawUrl.trim();
        if (trimmed.startsWith('idb:')) {
          try {
            var blob = await getAudioBlobFromIDB(trimmed);
            if (blob) return URL.createObjectURL(blob);
          } catch(e) {}
        }
        if (/^https?:\/\//i.test(trimmed)) {
          if (trimmed.includes('tmpfiles.org/') && !trimmed.includes('tmpfiles.org/dl/')) {
            trimmed = trimmed.replace('tmpfiles.org/', 'tmpfiles.org/dl/');
          }
          try {
            var cached = await getAudioBlobFromIDB(trimmed);
            if (cached) return URL.createObjectURL(cached);
          } catch(e) {}
          return trimmed;
        }
        if (trimmed.startsWith('data:') || trimmed.startsWith('blob:') || trimmed.startsWith('./') || trimmed.startsWith('../')) return trimmed;
        return '../' + trimmed;
      }

      function decompressText(text) {
        if (!text) return '';
        if (window.Keypans && typeof window.Keypans.decompressWithDictionary === 'function') {
          return window.Keypans.decompressWithDictionary(text);
        }
        return text;
      }

      const params = new URLSearchParams(window.location.search);
      const encoded = params.get('d') || params.get('id');
      const audioEl = document.getElementById('firew-audio');
      const musicBtn = document.getElementById('firew-music-btn');
      const toggleBtn = document.getElementById('firew-toggle-card');
      const cardEl = document.getElementById('firew-card');
      let musicUrl = '../n/c.mp3';

      if (encoded && typeof LZString !== 'undefined') {
        try {
          const raw = LZString.decompressFromEncodedURIComponent(encoded);
          if (raw) {
            const parts = raw.split('|');
            const imagesStr = parts[0] || '';
            const messagesStr = parts[1] || '';
            const customMusic = parts[2] || '';

            if (messagesStr) {
              const msgs = messagesStr.split(';;;').map(decompressText).filter(Boolean);
              document.getElementById('firew-msg').innerHTML = msgs.map(m => `<p style="margin:4px 0;">${m}</p>`).join('');
            } else {
              document.getElementById('firew-msg').textContent = 'Chúc bạn một năm mới ngập tràn niềm vui và may mắn!';
            }

            if (imagesStr) {
              const imgs = imagesStr.split(',').filter(Boolean);
              const photosDiv = document.getElementById('firew-photos');
              imgs.forEach(src => {
                const img = document.createElement('img');
                img.src = src.startsWith('http') ? src : 'https://' + src;
                img.style.cssText = 'width:55px;height:55px;object-fit:cover;border-radius:10px;border:2px solid #ff758f;';
                photosDiv.appendChild(img);
              });
            }

            if (customMusic) {
              musicUrl = customMusic;
            }
          }
        } catch(e) {
          console.error('Lỗi giải mã:', e);
        }
      }

      resolveAudioStream(musicUrl).then(src => {
        audioEl.src = src;
      });

      // Tự động phát nhạc khi chạm màn hình lần đầu
      function autoStart() {
        if (audioEl.paused) {
          audioEl.play().then(() => {
            musicBtn.textContent = '⏸️ Tạm dừng';
          }).catch(() => {});
        }
        window.removeEventListener('click', autoStart);
        window.removeEventListener('touchstart', autoStart);
      }
      window.addEventListener('click', autoStart, { once: true });
      window.addEventListener('touchstart', autoStart, { once: true });

      musicBtn.addEventListener('click', () => {
        if (audioEl.paused) {
          audioEl.play().then(() => {
            musicBtn.textContent = '⏸️ Tạm dừng';
          }).catch(e => console.log(e));
        } else {
          audioEl.pause();
          musicBtn.textContent = '▶️ Bật Nhạc';
        }
      });

      toggleBtn.addEventListener('click', () => {
        const msg = document.getElementById('firew-msg');
        const photos = document.getElementById('firew-photos');
        if (msg.style.display === 'none') {
          msg.style.display = 'block';
          photos.style.display = 'flex';
          toggleBtn.textContent = 'Ẩn bảng tin';
        } else {
          msg.style.display = 'none';
          photos.style.display = 'none';
          toggleBtn.textContent = 'Hiện bảng tin';
        }
      });
    })();
  </script>
</body>

</html>
