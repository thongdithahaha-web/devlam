<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="author" content="devlekimlam">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tạo Món Quà Tình Yêu Valentine X</title>
    <link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;600;700&family=Playpen+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="icon" href="https://github.com/devlekimlam/anh/blob/main/icon1.png?raw=true" type="image/png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.5.0/lz-string.min.js"></script>
    <script src="../assets/keypan.js"></script>
    <style>
:root{--primary:#ff4d6d;--primary-hover:#ff758f;--bg:#fff0f3;--glass:rgba(255,255,255,0.8);}body{font-family:'Quicksand',sans-serif;background:radial-gradient(circle,#fff0f3 0%,#ffccd5 100%);margin:0;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px;overflow-x:hidden;}.container{background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:30px;border-radius:25px;max-width:480px;width:100%;box-shadow:0 15px 35px rgba(255,77,109,0.2);border:1px solid rgba(255,255,255,0.5);}h2{text-align:center;color:var(--primary);font-size:26px;margin:05px;font-weight:700;}.box{background:white;border:1px solid #ffccd5;padding:18px;border-radius:15px;margin-bottom:18px;transition:0.3s;}.box:hover{box-shadow:0 5px 15px rgba(255,77,109,0.1);transform:translateY(-2px);}label{font-weight:600;color:#880d1e;font-size:14px;}select,input{text-align:center;}input,textarea,select{width:100%;padding:12px;border-radius:10px;border:1.5px solid #eee;margin-top:8px;font-family:inherit;box-sizing:border-box;font-family:"Mali",cursive;}input:focus,textarea:focus{outline:none;border-color:var(--primary);background:#fffafa;}.custom-upload-button{background:linear-gradient(45deg,var(--primary),#ff758f);color:#fff;padding:12px;border-radius:12px;text-align:center;cursor:pointer;display:block;margin-top:10px;font-weight:600;box-shadow:0 4px 10px rgba(255,77,109,0.3);}.btn-create{width:100%;background:linear-gradient(45deg,#ffb1b1,#ff6767);color:#fff;padding:10px;border:none;border-radius:15px;font-size:18px;font-weight:700;cursor:pointer;box-shadow:0 6px 15px rgba(46,204,113,0.3);transition:0.3s;font-family:"Mali",cursive;}.btn-create:hover{transform:scale(1.02);filter:brightness(1.1);}#captcha-popup{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(15,23,42,0.6);backdrop-filter:blur(4px);display:none;justify-content:center;align-items:center;z-index:1000;animation:fadeIn 0.3s ease-out;}#captcha-popup>div{background:var(--bg);padding:32px;border-radius:24px;text-align:center;width:90%;max-width:360px;box-shadow:0 25px 50px -12px rgba(0,0,0,0.25);border:1px solid rgba(255,255,255,0.1);}#captcha-popup h3{margin-bottom:20px;color:var(--text-main);font-size:1.25rem;font-weight:700;}.captcha-container{background:#f1f5f9;padding:15px;border-radius:12px;margin-bottom:20px;display:flex;justify-content:center;align-items:center;gap:15px;position:relative;}#captcha-code{background:white;padding:8px 16px;border-radius:8px;font-size:28px;font-weight:800;letter-spacing:4px;color:var(--primary);border:2px solid #e2e8f0;user-select:none;font-family:'Courier New',monospace;}#captcha-input{width:100%;padding:12px 16px;border:2px solid #e2e8f0;border-radius:12px;font-size:16px;outline:none;transition:all 0.2s;box-sizing:border-box;}#captcha-input:focus{border-color:var(--primary);box-shadow:0 0 0 4px rgba(79,70,229,0.1);}#captcha-error{color:var(--error);font-size:13px;margin-top:8px;height:18px;font-weight:500;}#captcha-submit{background:var(--primary);color:white;border:none;padding:14px;border-radius:12px;width:100%;margin-top:10px;font-size:16px;font-weight:600;cursor:pointer;transition:background 0.2s,transform 0.1s;}#captcha-submit:hover{background:var(--primary-hover);}#captcha-submit:active{transform:scale(0.98);}#refresh-captcha{background:none;border:none;font-size:20px;cursor:pointer;padding:5px;color:#64748b;transition:transform 0.3s ease;}#refresh-captcha:hover{color:var(--primary);transform:rotate(180deg);}@keyframes fadeIn{from{opacity:0;transform:translateY(-10px);}to{opacity:1;transform:translateY(0);}}#thumbs{margin-top:15px;}.thumb{border-radius:12px;transition:0.2s;}.thumb:hover{transform:scale(1.1);}#result{margin-top:20px;background:#e8f5e9;color:#2e7d32;font-weight:600;}#thumbs{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:15px;padding:10px;border-radius:10px;background:rgba(255,255,255,0.5);}.thumb{width:80px;height:80px;object-fit:cover;border-radius:12px;border:2px solid #ffccd5;transition:all 0.3s ease;cursor:pointer;box-shadow:0 4px 8px rgba(0,0,0,0.1);}.thumb:hover{transform:scale(1.1);border-color:var(--primary);box-shadow:0 6px 12px rgba(255,77,109,0.3);}.thumb-item{position:relative;display:inline-block;}.thumb-item .del{position:absolute;top:-5px;right:-5px;background:var(--primary);color:white;border:none;border-radius:50%;width:20px;height:20px;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:10;}#result{display:none;margin-top:25px;padding:0;border:none;background:transparent;}.result-container{background:#fff;padding:20px;border-radius:18px;border:2px solid #ffccd5;box-shadow:0 10px 20px rgba(255,77,109,0.1);animation:popIn 0.4s cubic-bezier(0.175,0.885,0.32,1.275);}@keyframes popIn{0%{opacity:0;transform:scale(0.9);}100%{opacity:1;transform:scale(1);}}.result-container label{display:block;margin-bottom:10px;color:var(--primary-dark);font-size:15px;text-align:center;}#linkInput{width:100%;background:#f9f9f9;border:1px solid #ddd;padding:12px;border-radius:10px;font-size:13px;color:#555;text-align:center;margin-bottom:15px;cursor:pointer;}.result-buttons{display:flex;gap:10px;}.result-buttons button,.result-buttons a{flex:1;height:45px;display:flex;align-items:center;justify-content:center;border-radius:12px;font-weight:600;font-size:14px;cursor:pointer;transition:all 0.2s;text-decoration:none;border:none;}.btn-copy{background:var(--primary);color:white;}.btn-view{background:#5dade2;color:white;}.btn-copy:hover,.btn-view:hover{transform:translateY(-3px);box-shadow:0 5px 10px rgba(0,0,0,0.1);filter:brightness(1.05);}.error{color:#d90429;font-size:13px;margin-top:8px;font-weight:600;display:none;align-items:center;gap:5px;background:#fff0f3;padding:8px 12px;border-radius:8px;border-left:4px solid #ff4d6d;animation:shake 0.3s ease-in-out;}.footer-note{text-align:center;font-size:12px;color:#888;margin-top:20px;}@keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-5px);}75%{transform:translateX(5px);}}
    </style>
</head>
<body>
    <div id="devlekimlam"></div><div id="Devpan" style="display:none"></div>

<div id="loading-screen"><div class="spinner"></div><div id="loading-text">Loading</div></div><div class="container"><h2>Nhập nội dung</h2><div class="box"><label>Tiêu đề</label><input id="title" placeholder="Chào Công Chúa"><label style="margin-top:8px">Mật mã (4 số) bỏ trống để hiển thị hoa</label><input id="pass" maxlength="4" inputmode="numeric" oninput="this.value=this.value.replace(/\D/g,'')"><div id="passError" class="error"></div></div><div class="box"><label>Lời chúc</label><textarea id="msg" rows="3"></textarea></div><div class="box"><label>Ảnh kỷ niệm</label><label for="upload-imgbb" class="custom-upload-button">📷 Upload ảnh</label><input type="file" id="upload-imgbb" accept="image/*" multiple hidden><textarea id="images" style="display:none;"></textarea><div id="thumbs"></div></div><div class="box"><label>🎵 Nhạc nền</label><select id="music"><option value="n/a.mp3">Nhac nền</option><option value="n/k.mp3">Kho Báu</option><option value="n/e.mp3">Lễ đường</option><option value="n/c.mp3">Chạm vào mây</option><option value="n/s.mp3">Happy birthday</option><option value="n/g.mp3">Không Thời Gian</option><option value="n/t.mp3">Từng Ngày Yêu Em</option><option value="n/d.mp3">Tình Yêu Giữa Mùa Đông</option></select></div><button class="btn-create" onclick="generateLink()">TẠO LINK</button><div id="result"></div><p class="footer-note">Â© 2026 devlekimlam - Handmade with love for your girl 🤍</p></div><div id="captcha-popup"><div><h3>Vui lòng nhập CAPTCHA</h3><div class="captcha-container"><span id="captcha-code">A1B2C</span><button id="refresh-captcha" title="Đổi mã khác">🔄</button></div><input type="text" id="captcha-input" placeholder="Nhập mã xác thực..." autocomplete="off" maxlength="6" /><div id="captcha-error"></div><button id="captcha-submit">Xác nhận</button></div></div>>
        // Loading screen fadeout
        window.addEventListener('load', () => {
            setTimeout(() => {
                const ls = document.getElementById('loading-screen');
                if (ls) ls.style.display = 'none';
            }, 300);
        });

        
    </script>
    <script src="./app/valentinex.js"></script>
</body>
</html>
