<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="author" content="devlekimlam">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tạo Bầu Trời Quà Tặng</title>
    <link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;600;700&family=Playpen+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="icon" href="../assets/logo.png" type="image/png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.5.0/lz-string.min.js"></script>
    <script src="../assets/keypan.js"></script>
    <style>
body{font-family:"Mali",cursive;background:linear-gradient(to bottom,#fff0f6,#ffe6f0);color:#333;display:flex;flex-direction:column;align-items:center;padding:20px;}.container{max-width:720px;width:100%;padding:30px;background:white;border-radius:16px;box-shadow:0 10px 25px rgba(233,30,99,0.15);box-sizing:border-box;}h1{color:#e91e63;text-align:center;margin-bottom:30px;}.input-group{margin-bottom:20px;width:100%;}label{font-weight:bold;display:block;margin-bottom:6px;color:#c2185b;margin-top:10px;}input,select,textarea{font-family:"Mali",cursive;font-weight:500;width:100%;padding:10px 14px;border-radius:10px;border:1px solid #ddd;box-sizing:border-box;font-size:18px;transition:border 0.2s ease;text-align:center;}input:focus,select:focus,textarea:focus{outline:none;border-color:#e91e63;box-shadow:0 0 0 2px rgba(233,30,99,0.2);}textarea{resize:vertical;}button{background:#e91e63;color:white;border:none;border-radius:10px;cursor:pointer;font-size:16px;transition:background 0.3s ease,transform 0.2s ease;}button:hover{background:#ff5757;transform:scale(1.02);}.message-input-item{position:relative;margin-bottom:10px;}.message-input-item input{padding-right:40px;}.remove-msg-btn{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:#838383;color:white;border:none;border-radius:50%;width:26px;height:26px;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;padding:0;}.remove-msg-btn:hover{background:#c2185b;}.btn-add-msg{display:flex;align-items:center;justify-content:center;width:42px;height:42px;margin:10px auto 0 auto;border-radius:50%;background-color:#e91e63;color:white;font-size:24px;font-weight:bold;cursor:pointer;border:none;box-shadow:0 4px 10px rgba(233,30,99,0.3);transition:all 0.2s ease;}.btn-add-msg:hover{background-color:#ff5757;transform:scale(1.1);}.custom-upload-button{display:inline-block;background-color:#e91e63;color:white;padding:10px 16px;border-radius:10px;cursor:pointer;font-size:15px;margin-top:8px;transition:background 0.3s ease;}.custom-upload-button:hover{background-color:#ff5757;}.output-group{width:100%;margin-top:25px;}.output-wrapper{display:flex;align-items:center;gap:10px;margin-top:8px;}.output-wrapper input{flex:1;padding:10px 14px;border-radius:10px;border:1px solid #ccc;font-size:15px;}.action-group{display:flex;gap:10px;margin-top:12px;}.btn-sub{flex:1;padding:12px;border-radius:10px;border:none;font-family:"Mali",cursive;font-size:15px;font-weight:bold;cursor:pointer;text-align:center;text-decoration:none;transition:all 0.2s ease;color:white;}.btn-view{background:#3498db;}.btn-view:hover{background:#2980b9;transform:translateY(-2px);}.btn-copy{background:#ff4e4e;}.btn-copy:hover{background:#ff6b6b;transform:translateY(-2px);}#preview{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px;padding:14px;border:2px dashed #e91e63;border-radius:10px;background-color:#fff5f9;min-height:120px;width:100%;box-sizing:border-box;}.preview-item{position:relative;display:inline-block;}.preview-item img{width:100px;height:100px;object-fit:cover;border-radius:10px;border:1px solid #ccc;box-shadow:0 2px 6px rgba(0,0,0,0.05);}.remove-btn{position:absolute;top:8px;right:8px;background-color:#838383;color:white;border:none;border-radius:50%;width:22px;height:22px;font-size:14px;text-align:center;cursor:pointer;box-shadow:0 0 5px rgba(0,0,0,0.2);}.remove-btn:hover{background-color:#c2185b;}.note{font-size:13px;color:#777;margin-top:5px;font-style:italic;}.custom-upload-button{font-family:"Mali",cursive;display:block;margin:10px auto;padding:12px 24px;background-color:#ff6e75;color:white;border-radius:6px;font-weight:bold;font-size:16px;cursor:pointer;transition:background-color 0.3s ease;box-shadow:0 4px 10px rgba(0,0,0,0.1);user-select:none;text-align:center;width:30%;}.custom-upload-button:hover{background-color:#ff9196;}#captcha-popup{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);align-items:center;justify-content:center;z-index:9999;}#captcha-popup>div{background:white;padding:25px 30px;border-radius:10px;max-width:320px;width:90%;text-align:center;box-shadow:0 5px 15px rgba(0,0,0,0.3);margin:20px}#captcha-code{font-family:"Mali",cursive;font-size:28px;font-weight:800;letter-spacing:5px;background:#ffbbbb;padding:10px 20px;user-select:none;border-radius:6px;}#refresh-captcha{margin-left:10px;padding:18px;border:none;border-radius:6px;background-color:#ff6e75;color:white;cursor:pointer;}#captcha-input{width:100%;padding:10px;font-size:16px;border:1px solid #ffbbbb;border-radius:6px;margin-top:15px;box-sizing:border-box;}#captcha-error{color:red;margin-top:10px;min-height:20px;}#captcha-submit{background-color:#ff6e75;color:white;border:none;border-radius:6px;padding:10px 20px;font-weight:bold;font-family:"Mali",cursive;cursor:pointer;}.generate-btn{display:block;margin:20px auto;background-color:#ff6e75;color:white;padding:12px 24px;border:none;border-radius:8px;font-size:17px;font-weight:bold;cursor:pointer;font-family:"Mali",cursive;transition:all 0.3s ease;box-shadow:0 5px 15px rgba(233,30,99,0.3);}.site-footer{margin-top:20px;text-align:center;color:#6b7280;font-size:0.95rem;}
    </style>
</head>
<body>
    <div id="devlekimlam"></div><div id="Devpan" style="display:none"></div>

<div id="loading-screen"><div class="spinner"></div><div id="loading-text">Loading</div></div><div class="container"><h1>Nhập thông điệp</h1><div class="input-group"><label>Tiêu đề:</label><input type="text" id="title" placeholder="Chúc mừng 20-10" /></div><div class="input-group"><label>Các câu lời chúc:</label><div id="messageInputsContainer"><div class="message-input-item"><input type="text" class="msg-input" placeholder="Lời chúc 1..." /></div><div class="message-input-item"><input type="text" class="msg-input" placeholder="Lời chúc 2..." /></div></div><button type="button" class="btn-add-msg" onclick="addMessageInput()" title="Thêm ô lời chúc">+</button></div><div class="input-group"><label>Thêm ảnh (tối đa được 4 ảnh):</label><label for="upload-imgbb" class="custom-upload-button">📷 Upload ảnh</label><input type="file" id="upload-imgbb" accept="image/*" multiple hidden></div><div class="input-group" style="display: none;"><label>Nhập danh sách link ảnh (mỗi dòng một ảnh):</label><textarea id="imageTextarea" rows="5" placeholder="./assets/a1.jpg&#10;./assets/a2.jpg"></textarea><div class="note">💡 Mỗi ảnh bên dưới có nút ❌ để xóa khỏi danh sách.</div></div><div id="preview"></div><button class="generate-btn" onclick="generateLink()">Tạo link</button><div id="output" class="output-group" style="display: none;"><label>Link của bạn:</label><div class="output-wrapper"><input type="text" id="linkOutput" readonly></div><div class="action-group"><a id="btnView" href="#" target="_blank" class="btn-sub btn-view">Xem trang</a><button id="btnCopyBottom" onclick="copyLink(this)" class="btn-sub btn-copy">Copy</button></div></div><div id="captcha-popup"><div><h3>Vui lòng nhập CAPTCHA</h3><div style="margin:15px 0; display: flex; align-items: center; gap: 10px;"><span id="captcha-code"></span><button id="refresh-captcha" title="Làm mới CAPTCHA">🔄</button></div><input type="text" id="captcha-input" placeholder="Nhập mã xác thực.." autocomplete="off" /><div id="captcha-error"></div><button id="captcha-submit">Xác nhận</button></div></div><footer class="site-footer"><p>© 2026 devlekimlam. A personal creation.❤️</p></footer></div>

    <script>
        // Loading screen fadeout
        window.addEventListener('load', () => {
            setTimeout(() => {
                const ls = document.getElementById('loading-screen');
                if (ls) ls.style.display = 'none';
            }, 300);
        });

        
    </script>
    <script src="./app/skygifts.js"></script>
</body>
</html>
