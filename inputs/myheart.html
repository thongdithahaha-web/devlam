    <style>
body,html{overflow-x:hidden;font-family:"Mali",cursive;max-width:600px;margin:20px auto;background-color:#fff0f4;border-radius:10px;color:#333;}.container{background-color:#ffffff;border-radius:12px;padding:20px;box-shadow:0 10px 30px rgba(214,51,108,0.1);border:1px solid #ffc2d1;}h1{text-align:center;color:#ff6e75;margin-top:0;}label{display:block;margin:15px 0 5px;font-weight:bold;color:#555;}textarea,input,select{width:100%;padding:10px 12px;border:1px solid #ddd;border-radius:6px;box-sizing:border-box;font-size:15px;transition:border 0.3s,box-shadow 0.3s;}textarea:focus,input:focus,select:focus{border-color:#d6336c;box-shadow:0 0 5px rgba(214,51,108,0.2);outline:none;}#music{display:block;margin:10px auto 0;width:60%;background-color:#fff;border:1px solid #ddd;padding:10px 12px;border-radius:6px;font-size:15px;font-family:"Mali",cursive;font-weight:600;color:#ff6262;appearance:none;background-image:url("data:image/svg+xml;utf8,<svg fill='%237a003c' height='24' viewBox='0 0 24 24' width='24' xmlns='http://www.w3.org/2000/svg'><path d='M7 10l5 5 5-5z'/></svg>");background-repeat:no-repeat;background-position:right 10px center;background-size:20px;cursor:pointer;transition:border-color 0.3s,box-shadow 0.3s;text-align:center;text-align-last:center;}#music:focus{border-color:#d6336c;box-shadow:0 0 5px rgba(255,127,127,0.2);outline:none;font-weight:600;}button{padding:12px 25px;font-size:16px;background-color:#ff6e75;color:white;border:none;border-radius:6px;cursor:pointer;transition:background-color 0.3s;font-family:"Mali",cursive;}button:hover{background-color:#ff9196;}#messagesContainer{margin:10px auto;display:flex;flex-direction:column;gap:10px;margin-top:10px;padding:10px;background:#f9f9f9;border:1px solid #ddd;border-radius:8px;}#messagesContainer div{display:flex;align-items:center;gap:8px;}#messagesContainer input[type="text"]{flex:1;padding:8px 10px;border:1px solid #ccc;border-radius:6px;font-family:"Mali",cursive;font-size:14px;transition:border-color 0.2s;font-weight:600;}#messagesContainer input[type="text"]:focus{border-color:#ff6e75;outline:none;}#messagesContainer button{background:#ff6e75;color:white;border:none;border-radius:6px;padding:6px 10px;cursor:pointer;transition:background 0.2s;}#messagesContainer button:hover{background:#ff4b5c;}.add-btn-wrapper{display:flex;justify-content:center;margin-top:12px;}#addMessage{background:#ff6e75;color:#fff;border:none;border-radius:6px;padding:12px 18px;cursor:pointer;font-size:14px;font-family:"Mali",cursive;font-weight:600;transition:background 0.2s,transform 0.2s;}#addMessage:hover{background:#f3868b;transform:scale(1.05);}#createLink{background:#ff6e75;border:none;padding:12px 18px;font-size:14px;font-weight:bold;color:white;border-radius:8px;cursor:pointer;transition:transform 0.2s ease,box-shadow 0.3s ease;box-shadow:0 4px 15px rgba(255,95,141,0.3);display:block;margin:30px auto 0;}#createLink:hover{background:#ff9196;transform:scale(1.02);box-shadow:0 6px 20px rgba(255,95,141,0.4);}#colorPickerContainer{display:flex;align-items:center;justify-content:center;gap:12px;padding:8px 12px;border:1px solid #ddd;border-radius:6px;background-color:#fff;box-sizing:border-box;height:44px;width:40%;margin:10px auto 0;}#colorPickerContainer input[type="color"]{appearance:none;width:32px;height:32px;border:none;padding:0;background:none;cursor:pointer;}#colorPickerContainer input[type="color"]::-webkit-color-swatch-wrapper{padding:0;}#colorPickerContainer input[type="color"]::-webkit-color-swatch{border:1px solid #ccc;border-radius:4px;}#colorValue{font-family:monospace;color:#ff6e75;font-size:14px;}#resultContainer{display:none;flex-direction:column;align-items:center;padding:20px;border-radius:12px;margin-top:25px;gap:15px;background-color:#fff5f5;border:1.5px dashed #ff9196;}#resultLink{width:100%;max-width:450px;font-size:14px;color:#555;border:1px solid #ddd;border-radius:8px;padding:10px 15px;height:42px;box-sizing:border-box;text-align:center;background-color:#fff;font-family:"Mali",cursive;}.button-group{display:flex;gap:12px;justify-content:center;width:100%;}#copyButton,#viewButton{min-width:120px;height:42px;border:none;border-radius:8px;cursor:pointer;font-size:14px;font-family:"Mali",cursive;font-weight:600;display:flex;align-items:center;justify-content:center;transition:all 0.3s;color:white;text-decoration:none;}#copyButton{background-color:#0a2f66;}#copyButton:hover{background-color:#061e42;transform:translateY(-2px);}#viewButton{background-color:#ff6e75;}#viewButton:hover{background-color:#ff9196;transform:translateY(-2px);}@media (max-width:640px){body{margin:20px;}}#imagePreview{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px;border:2px dashed #ccc;padding:10px;min-height:120px;justify-content:center;align-items:center;background-color:#fafafa;border-radius:6px;color:#aaa;font-style:italic;text-align:center;}.custom-upload-button{font-family:"Mali",cursive;display:block;margin:10px auto;padding:12px 24px;background-color:#ff6e75;color:white;border-radius:6px;font-weight:bold;font-size:16px;cursor:pointer;transition:background-color 0.3s ease;box-shadow:0 4px 10px rgba(0,0,0,0.1);user-select:none;text-align:center;width:30%;}.custom-upload-button:hover{background-color:#ff9196;}#captcha-popup{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);align-items:center;justify-content:center;z-index:9999;}#captcha-popup>div{background:white;padding:25px 30px;border-radius:10px;max-width:320px;width:90%;text-align:center;box-shadow:0 5px 15px rgba(0,0,0,0.3);margin:20px}#captcha-code{font-family:"Mali",cursive;font-size:28px;font-weight:800;letter-spacing:5px;background:#ffbbbb;padding:10px 20px;user-select:none;border-radius:6px;}#refresh-captcha{margin-left:10px;padding:18px;border:none;border-radius:6px;background-color:#ff6e75;color:white;cursor:pointer;}#captcha-input{width:100%;padding:10px;font-size:16px;border:1px solid #ffbbbb;border-radius:6px;margin-top:15px;box-sizing:border-box;}#captcha-error{color:red;margin-top:10px;min-height:20px;}#captcha-submit{margin-top:20px;background-color:#ff6e75;color:white;border:none;border-radius:6px;padding:10px 20px;font-weight:bold;cursor:pointer;}.site-footer{margin-top:10px;text-align:center;border-top:1px solid rgba(255,118,117,0.2);width:100%;}.site-footer p{font-family:"Mali",cursive;font-size:0.9rem;color:#a1a1a1;letter-spacing:0.5px;display:flex;align-items:center;justify-content:center;gap:6px;}.site-footer p b,.site-footer span{color:#ff7675;display:inline-block;animation:heartBeat 1.5s infinite;}@keyframes heartBeat{0%{transform:scale(1);}14%{transform:scale(1.3);}28%{transform:scale(1);}42%{transform:scale(1.3);}70%{transform:scale(1);}}.site-footer p:hover{color:#ff7675;transition:color 0.3s ease;cursor:default;}
    </style>

<body>
    <div id="devlekimlam"></div><div id="Devpan" style="display:none"></div>

<div class="container"><h1>Nhập dữ liệu</h1><div class="instructions">Lưu ý:<br /> Nhớ ấn copy link trước khi chuyển qua tạo QR<br /> Nếu muốn tạo web riêng nhắn tin qua mình </div><label for="messages">Lời nhắn:</label><div id="messagesContainer"></div><p id="warning" style="color: #ff6e75; font-size: 14px; margin-top: 8px; display: none;"></p><div class="add-btn-wrapper"><button type="button" id="addMessage">+ Thêm câu</button></div><label for="images">Thêm ảnh:</label><label for="upload-imgbb" class="custom-upload-button">📷 Upload ảnh</label><input type="file" id="upload-imgbb" accept="image/*" multiple hidden><!-- <label for="images">Images (mỗi dòng 1 đường link ảnh):</label> --><textarea style="display: none;" id="images" rows="4" placeholder="Ví dụ:"></textarea><div id="imagePreview"></div><label for="heartColor">Heart Color:</label><div id="colorPickerContainer"><input type="color" id="heartColor" value="#ff9090" /><span id="colorValue">#ff9090</span></div><label for="music">Chọn nhạc:</label><select id="music"><option value="">-- Không chọn --</option><option value="n/a.mp3">Nhac nền</option><option value="n/k.mp3">Kho Báu</option><option value="n/e.mp3">Lễ đường</option><option value="n/c.mp3">Chạm vào mây</option><option value="n/s.mp3">Happy birthday</option><option value="n/g.mp3">Không Thời Gian</option><option value="n/t.mp3">Từng Ngày Yêu Em</option><option value="n/d.mp3">Tình Yêu Giữa Mùa Đông</option></select><button id="createLink">Tạo link</button><div id="resultContainer"><input type="text" id="resultLink" readonly placeholder="Link sẽ hiện ở đây..." /><div class="button-group"><a id="viewButton" target="_blank">Xem trang</a><button id="copyButton" onclick="copyLink()">Copy</button></div></div><div id="captcha-popup"><div><h3>Vui lòng nhập CAPTCHA</h3><div style="margin:15px 0; display: flex; align-items: center; gap: 10px;"><span id="captcha-code"></span><button id="refresh-captcha" title="Làm mới CAPTCHA">🔄</button></div><input type="text" id="captcha-input" placeholder="Nhập mã xác thực.." autocomplete="off" /><div id="captcha-error"></div><button id="captcha-submit">Xác nhận</button></div></div><footer class="site-footer"><p>© 2025 <b>devlekimlam</b>. A personal creation. <span>❤️</span></p></footer></div>

    <script>
        // Loading screen fadeout
        window.addEventListener('load', () => {
            setTimeout(() => {
                const ls = document.getElementById('loading-screen');
                if (ls) ls.style.display = 'none';
            }, 300);
        });

        
    </script>
