<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="author" content="Devpan">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tạo Hiệu Ứng Mưa Tình Yêu</title>
    <link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;600;700&family=Playpen+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="icon" href="https://github.com/Panbap/anh/blob/main/icon1.png?raw=true" type="image/png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.5.0/lz-string.min.js"></script>
    <script src="../assets/keypan.js"></script>
    <style>
*{box-sizing:border-box;}body{font-family:"Mali";background:#f9c9c9;color:#333;display:flex;flex-direction:column;align-items:center;padding:20px 20px 0;min-height:100vh;}h1{font-family:"Mali";font-size:28px;color:#ff8080;text-shadow:0 0 2px rgb(255,159,167);text-align:center;margin:0;}.container{width:100%;max-width:500px;background-color:#ffffff;padding:30px;border-radius:12px;box-shadow:0 0 15px rgba(255,105,105,0.3);}.input-group{display:flex;flex-direction:column;gap:10px;max-width:450px;}.input-wrapper{display:flex;align-items:center;border:2px solid #ff99a5;border-radius:10px;background:#fff0f3;padding:5px 8px;transition:all 0.2s ease;}.input-wrapper:hover{box-shadow:0 0 8px rgba(255,153,165,0.6);transform:translateY(-2px);}.input-wrapper input{flex:1;border:none;padding:8px 10px;outline:none;font-size:15px;font-family:"Mali",cursive;background:transparent;color:#333;font-weight:bold;}.input-wrapper input::placeholder{color:#696969;font-style:italic;}.input-wrapper button{flex:0 0 auto;margin-left:6px;width:40px;height:42px;border:none;border-radius:18%;background:#ff6673;color:#fff;cursor:pointer;font-size:14px;text-align:center;transition:background 0.2s ease,transform 0.2s ease;}.input-wrapper button:hover{background:#ff4c5b;transform:scale(1.1);}label{display:block;margin-top:20px;margin-bottom:8px;font-weight:bold;color:#ff6666;}.select-group{border:none;}select,input[type="text"],button{font-family:"Mali";text-align:center;width:100%;padding:10px;border-radius:6px;border:none;font-size:13px;outline:none;margin-top:5px;}select,input[type="text"]{background-color:#ffc3c3;box-shadow:0 0 4px rgb(255,159,167);color:#333;}button{background-color:#ff6673;box-shadow:0 0 4px rgb(255,159,167);color:white;font-weight:bold;}button:hover{background-color:#ff4c5b;}.generate-btn{background-color:#ff6673;color:white;font-weight:bold;margin-top:25px;padding:10px;border-radius:6px;border:none;cursor:pointer;font-size:16px;width:100%;}.generate-btn:hover{background-color:#ff4c5b;}small{color:#777;display:block;margin-top:10px;text-align:center;font-size:13px;}.optional-note{font-size:13px;color:#888;margin-top:4px;}.gif-preview{margin-top:15px;text-align:center;display:none;}.gif-image{max-width:50%;border-radius:8px;box-shadow:0 0 8px rgba(255,105,180,0.3);}.link-row{display:flex;align-items:center;gap:10px;margin-top:10px;max-width:100%;justify-content:center;}.copy-btn{width:20%;font-size:15px;border:none;border-radius:6px;background-color:#ff6673;color:#fff;font-weight:bold;cursor:pointer;flex-shrink:0;}.copy-btn:hover{background-color:#ff4c5b;}#finalLink{flex-grow:1;font-size:15px;padding:10px;border-radius:6px;border:none;background-color:#fff0f5;color:#000000;user-select:all;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}.donate-box{margin-top:25px;text-align:center;background-color:#ffc3c3;padding:20px;border-radius:12px;box-shadow:0 0 12px rgb(255,159,167);max-width:360px;margin-left:auto;margin-right:auto;}.qr-image{max-width:200px;width:100%;margin-top:10px;border-radius:8px;box-shadow:0 0 8px rgba(255,105,180,0.2);}#qrBox{display:flex;justify-content:center;align-items:center;height:100%;width:100%;text-align:center;margin-top:20px;}#qrcode{max-width:100%;height:auto;}#qrBox{display:none;text-align:center;margin-top:20px;}#downloadQRButton{display:none;margin-top:15px;}#qrcode canvas{max-width:100%;height:auto;display:inline-block;}#rainColor{display:block;margin:0 auto;}.custom-upload-button{display:block;margin:10px auto;padding:12px 12px;background-color:#ff6565;color:white;border-radius:6px;font-weight:bold;font-size:14px;cursor:pointer;transition:background-color 0.3s ease;box-shadow:0 4px 10px rgba(0,0,0,0.1);user-select:none;text-align:center;width:30%;}.custom-upload-button:hover{background:#ff6b6b;box-shadow:0 8px 20px rgba(150,5,5,0.4);}#captcha-popup{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);align-items:center;justify-content:center;z-index:9999;}#captcha-popup>div{background:white;padding:25px 30px;border-radius:10px;max-width:320px;width:90%;text-align:center;box-shadow:0 5px 15px rgba(0,0,0,0.3);}#captcha-code{font-family:'Playpen Sans',cursive;font-size:28px;font-weight:bold;letter-spacing:5px;background:#ffbbbb;padding:10px 20px;user-select:none;border-radius:6px;}#refresh-captcha{margin-left:10px;padding:16px;border:none;border-radius:6px;background:#ff7094;color:white;cursor:pointer;}#captcha-input{width:100%;padding:10px;font-size:16px;border:2px solid #ff7094;border-radius:6px;margin-top:15px;box-sizing:border-box;text-align:center;text-align-last:center;}#captcha-error{color:red;margin-top:10px;min-height:20px;}.button-wrapper{display:flex;justify-content:center;}#captcha-submit{background:#ff7094;color:white;border:none;border-radius:6px;padding:10px 20px;font-weight:bold;cursor:pointer;}.ringtext-container>div{display:flex;align-items:center;margin-bottom:6px;}.ring-text-input{flex:1;padding:8px;border:1px solid #ccc;border-radius:6px;font-size:14px;outline:none;text-align:center;font-family:'Playpen Sans',cursive;font-weight:600;}.ring-text-input:focus{border-color:#ff7094;box-shadow:0 0 0 2px rgba(0,119,204,0.2);}.ringtext-section{margin-bottom:20px;}.ringtext-section button{margin-left:6px;}.remove-ring-btn{background-color:#ff7094;color:white;border:none;border-radius:6px;padding:6px 10px;font-size:14px;cursor:pointer;}.remove-ring-btn:hover{background-color:#e04040;}footer{text-align:center;margin:20px auto 0;color:rgb(138,138,138);font-weight:600;font-size:1rem;font-family:"Mali";}
    </style>
</head>
<body>
    <div id="Devpan"></div>

<div class="container"><h1>Nhập dữ liệu</h1><div class="input-group"><label for="message">Nhập lời chúc:</label><small><strong>Hướng dẫn:</strong> Mỗi ô là 1 câu. Bạn có thể thêm nhiều ô.</small><div id="messagesContainer"><div class="input-wrapper"><input type="text" class="message" value="Chúc mừng" placeholder="Nhập lời chúc..."></div><div class="input-wrapper"><input type="text" class="message" value="sinh nhật" placeholder="Nhập lời chúc..."></div><div class="input-wrapper"><input type="text" class="message" value="bạn yêu" placeholder="Nhập lời chúc..."></div></div><button type="button" id="addMessageBtn">➕ Thêm câu</button></div><label class="select-group" for="gif">Ảnh GIF (chọn sẵn):</label><select id="gif" onchange="toggleCustomImageInput()"><option value="">Không chọn</option><option value="a/h1.gif">Happy Birthday</option><option value="a/h2.gif">Happy Birthday1</option><option value="a/h3.gif">Happy Birthday2</option><option value="a/i1.gif">I love you1</option><option value="a/i2.gif">I love you2</option><option value="a/m1.gif">I miss you</option><option value="a/1.gif">Hi</option></select><div id="customImageGroup"><label for="customImage">Chọn ảnh của bạn:</label><input style="display:none;" type="text" id="customImage" placeholder="VD: https://devpan.com/your.jpg" /><small class="optional-note">Nếu bạn chọn ảnh GIF, ô này sẽ bị bỏ qua.</small><br><label for="upload-imgbb" class="custom-upload-button">📷 Upload ảnh</label><input type="file" id="upload-imgbb" accept="image/*" multiple hidden></div><div id="preview"></div><div id="gifPreview" class="gif-preview" style="display:none; text-align:center; margin-top:15px;"><p>Ảnh bạn đã chọn:</p><img id="gifImage" alt="GIF Preview" class="gif-image" style="max-width: 50%; border-radius: 8px; box-shadow: 0 0 8px #ff66aa99;" /></div><label for="music">Chọn nhạc nền:</label><select id="music"><option value="">-- Không chọn --</option><option value="n/a.mp3">Nhac nền</option><option value="n/k.mp3">Kho Báu</option><option value="n/e.mp3">Lễ đường</option><option value="n/c.mp3">Chạm vào mây</option><option value="n/s.mp3">Happy birthday</option><option value="n/g.mp3">Không Thời Gian</option><option value="n/t.mp3">Từng Ngày Yêu Em</option><option value="n/d.mp3">Tình Yêu Giữa Mùa Đông</option></select><label for="rainText">Chữ nền:</label><input type="text" id="rainText" placeholder="VD: I LOVE U" value="I LOVE YOU"><small class="optional-note">Bạn có thể nhập một câu, ví dụ: HAPPY BIRTHDAY 🎉</small><label for="rainColor">Màu chữ nền:</label><input type="color" id="rainColor" value="#f584b7"><small class="optional-note">Chọn màu chữ rơi (mặc định hồng #f584b7)</small><button class="generate-btn" onclick="generateLink()">Tạo Link</button><div id="linkOutput"></div><div id="qrBox"><div id="qrcode" style="display: inline-block;"></div></div><div id="captcha-popup"><div><h3>Vui lòng nhập CAPTCHA</h3><div style="margin:15px 0; display: flex; align-items: center; gap: 10px;"><span id="captcha-code"></span><button id="refresh-captcha" title="Làm mới CAPTCHA">🔄</button></div><input type="text" id="captcha-input" placeholder="Nhập mã xác thực.." autocomplete="off" /><div id="captcha-error"></div><div class="button-wrapper"><button id="captcha-submit">Gửi mã</button></div></div></div></div>

    <script>
        // Loading screen fadeout
        window.addEventListener('load', () => {
            setTimeout(() => {
                const ls = document.getElementById('loading-screen');
                if (ls) ls.style.display = 'none';
            }, 300);
        });

        
    </script>
    <script src="./app/rainlove.js"></script>
</body>
</html>
