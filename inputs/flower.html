<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="author" content="Devpan">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Làm Quà Tặng Nàng - Tạo Thiệp Hoa</title>
    <link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;600;700&family=Playpen+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="icon" href="https://github.com/Panbap/anh/blob/main/icon1.png?raw=true" type="image/png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.5.0/lz-string.min.js"></script>
    <script src="../assets/keypan.js"></script>
    <style>
:root{--primary:#ff758c;--secondary:#ff7eb3;--glass:rgba(255,255,255,0.85);--text:#4a4a4a;}*{box-sizing:border-box;margin:0;padding:0;}body{font-family:"Mali",cursive;min-height:100vh;display:flex;justify-content:center;align-items:center;background:#e7e7e7;background-size:400% 400%;animation:gradientBG 15s ease infinite;padding:20px;overflow-x:hidden;}@keyframes gradientBG{0%{background-position:0% 50%;}50%{background-position:100% 50%;}100%{background-position:0% 50%;}}.container{background:var(--glass);backdrop-filter:blur(15px);-webkit-backdrop-filter:blur(15px);border-radius:30px;padding:40px;width:100%;max-width:500px;box-shadow:0 20px 50px rgba(0,0,0,0.15);border:1px solid rgba(255,255,255,0.4);position:relative;overflow:hidden;}h2{font-family:"Mali",cursive;font-size:32px;color:var(--primary);text-align:center;margin-bottom:30px;font-weight:700;}.input-box{position:relative;margin-bottom:20px;}.input-box i{position:absolute;left:15px;top:38px;color:var(--primary);font-size:18px;}label{display:block;margin-bottom:8px;font-weight:600;color:var(--text);font-size:14px;padding-left:5px;}#input-music{text-align:center;text-align-last:center;padding-left:15px !important;cursor:pointer;}input,textarea,select{width:100%;padding:12px 15px 12px 45px;border-radius:15px;border:1px solid rgba(0,0,0,0.1);background:rgba(255,255,255,0.5);font-family:"Mali",cursive;font-size:15px;transition:0.3s;color:#333;}input:focus,textarea:focus,select:focus{outline:none;border-color:var(--primary);background:#fff;box-shadow:0 5px 15px rgba(255,117,140,0.1);}textarea{height:100px;resize:none;}.custom-upload-button{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:12px 15px;border-radius:15px;background:linear-gradient(45deg,var(--primary),var(--secondary));color:white;font-weight:600;cursor:pointer;box-shadow:0 5px 15px rgba(255,117,140,0.2);transition:0.3s;margin-top:5px;}.custom-upload-button:hover{transform:translateY(-2px);opacity:0.95;}#preview-thumbs{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:12px;}.thumb-item{position:relative;display:inline-block;}.thumb{width:70px;height:70px;object-fit:cover;border-radius:10px;border:2px solid var(--primary);box-shadow:0 4px 8px rgba(0,0,0,0.1);}.thumb-item .del{position:absolute;top:-6px;right:-6px;background:#ff4444;color:white;border:none;border-radius:50%;width:22px;height:22px;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:0.2s;}.thumb-item .del:hover{transform:scale(1.1);}button#btn-go{font-family:"Mali",cursive;width:100%;padding:15px;border:none;border-radius:15px;background:linear-gradient(45deg,var(--primary),var(--secondary));color:white;font-size:18px;font-weight:700;cursor:pointer;transition:0.3s;box-shadow:0 10px 20px rgba(255,117,140,0.3);margin-top:10px;}button#btn-go:hover{transform:translateY(-3px);box-shadow:0 15px 25px rgba(255,117,140,0.4);}#result-area{display:none;margin-top:30px;padding-top:25px;border-top:2px dashed rgba(255,117,140,0.3);animation:slideUp 0.5s ease-out;}@keyframes slideUp{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}.result-label{text-align:center;font-weight:700;color:#2ec1cc;margin-bottom:15px;display:block;}.link-wrapper{display:flex;background:#fff;border-radius:12px;padding:5px;border:1px solid #eee;margin-bottom:15px;}#output-link{border:none;background:transparent;padding:10px;font-size:13px;color:#666;flex:1;padding-left:10px;}.action-btns{display:flex;gap:10px;}.btn-action{flex:1;padding:12px;border:none;border-radius:12px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;color:white;transition:0.2s;}.btn-copy{font-family:"Mali",cursive;background:#758a9e;}.btn-view{font-family:"Mali",cursive;background:#03103a;}.btn-action:hover{opacity:0.9;transform:scale(0.98);}.footer-note{text-align:center;font-size:12px;color:#888;margin-top:20px;}#captcha-popup{position:fixed;inset:0;background:rgba(0,0,0,0.75);backdrop-filter:blur(4px);display:none;justify-content:center;align-items:center;z-index:100000;animation:fadeIn 0.3s ease;}@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}#captcha-box{background:#fff;padding:25px;border-radius:20px;text-align:center;width:90%;max-width:320px;box-shadow:0 20px 40px rgba(0,0,0,0.3);font-family:"Mali",cursive;}#captcha-box h3{color:var(--primary);margin-bottom:12px;font-size:20px;}#captcha-code{background:#f1f5f9;padding:10px;border-radius:10px;font-size:24px;font-weight:800;letter-spacing:5px;color:var(--primary);margin-bottom:15px;border:1px solid #e2e8f0;user-select:none;}#captcha-box input{padding:10px 15px;margin-bottom:10px;text-align:center;}#captcha-error{color:#ff4444;font-size:13px;margin-bottom:10px;min-height:18px;font-weight:600;}#captcha-submit,#refresh-captcha{font-family:"Mali",cursive;background:var(--primary);color:white;border:none;padding:10px 20px;border-radius:10px;cursor:pointer;font-weight:600;margin:5px;transition:0.2s;}#refresh-captcha{background:#758a9e;}#captcha-submit:hover,#refresh-captcha:hover{opacity:0.9;transform:translateY(-2px);}
    </style>
</head>
<body>
    <div id="Devpan"></div>

<div id="loading-screen"><div class="spinner"></div><div id="loading-text">Loading</div></div><div class="container"><h2>Làm Quà Tặng Nàng</h2><div class="input-box"><label>Thông điệp đầu (Ví dụ: Bó hoa tặng nàng)</label><!-- <i class="fa-solid fa-wand-magic-sparkles"></i> --><input id="input-special" placeholder="Nhập điều bất ngờ..." /></div><div class="input-box"><label>Tiêu đề thư</label><!-- <i class="fa-solid fa-heart"></i> --><input id="input-title" placeholder="Gửi người thương..." /></div><div class="input-box"><label>Lời nhắn nhủ</label><!-- <i class="fa-solid fa-pen-nib"></i> --><textarea id="input-content" placeholder="Viết những lời tình tứ nhất..."></textarea></div><div class="input-box"><label>Ký tên</label><!-- <i class="fa-solid fa-signature"></i> --><input id="input-sign" placeholder="Ký tên anh..." /></div><!-- Ô thêm ảnh kỷ niệm bay lên & Trigger Captcha --><div class="input-box"><label>Ảnh kỷ niệm (Bay lên)</label><label for="upload-imgbb" class="custom-upload-button"> Chọn hoặc Upload ảnh </label><input type="file" id="upload-imgbb" accept="image/*" multiple hidden><textarea id="input-images" style="display:none;"></textarea><div id="preview-thumbs"></div></div><div class="input-box"><label>Nhạc nền</label><!-- <i class="fa-solid fa-music"></i> --><select id="input-music" style="padding-left: 45px;"><option value="n/a.mp3">Nhạc nền</option><option value="n/k.mp3">Kho Báu</option><option value="n/e.mp3">Lễ đường</option><option value="n/c.mp3">Chạm vào mây</option><option value="n/s.mp3">Happy birthday</option><option value="n/g.mp3">Không Thời Gian</option><option value="n/t.mp3">Từng Ngày Yêu Em</option><option value="n/d.mp3">Tình Yêu Giữa Mùa Đông</option></select></div><button id="btn-go">Tạo Link <i class="fa-solid fa-paper-plane"></i></button><div id="result-area"><span class="result-label"><i class="fa-solid fa-circle-check"></i> Đã tạo link thành công!</span><div class="link-wrapper"><input id="output-link" readonly value="" /></div><div class="action-btns"><button class="btn-action btn-view" id="btn-view"><i class="fa-solid fa-eye"></i> Xem trang </button><button class="btn-action btn-copy" id="btn-copy"><i class="fa-solid fa-copy"></i> Copy </button></div></div><p class="footer-note">@2025 Devpan - Handmade with love for your girl 🤍</p></div><!-- Captcha Popup --><div id="captcha-popup"><div id="captcha-box"><h3>Xác thực Captcha</h3><span id="captcha-code">A1B2C</span><input type="text" id="captcha-input" placeholder="Nhập mã xác thực..." autocomplete="off" /><div id="captcha-error"></div><div><button id="captcha-submit">Xác nhận</button><button id="refresh-captcha">🔄 Đổi</button></div></div></div><!-- Donate Modal -->

    <script>
        // Loading screen fadeout
        window.addEventListener('load', () => {
            setTimeout(() => {
                const ls = document.getElementById('loading-screen');
                if (ls) ls.style.display = 'none';
            }, 300);
        });

        
    </script>
    <script src="./app/flower.js"></script>
</body>
</html>
