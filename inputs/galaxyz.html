    <style>
*{box-sizing:border-box;overflow-x:hidden;}body{font-family:"Mali",cursive;background:linear-gradient(to right,#ffa8a8,#ffcaca);margin:0;padding:0 10px;color:#333;min-height:100vh;display:flex;justify-content:center;align-items:flex-start;flex-direction:column;}.container{flex:1;margin:10px auto;width:100%;max-width:600px;padding:0 20px 20px;background:white;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,0.1);}h1{font-size:32px;color:#ff7094;text-align:center;margin-bottom:20px;text-shadow:1px 1px 2px #ccc;font-weight:700;letter-spacing:1px;}.instructions{font-family:"Mali",cursive;background-color:#fff3f7;border-left:4px solid #ff7094;padding:10px 15px;border-radius:6px;margin-bottom:20px;}textarea{font-family:"Mali",cursive;width:100%;padding:12px;font-size:16px;border:1px solid #ccc;border-radius:6px;box-sizing:border-box;resize:vertical;box-shadow:0 2px 6px rgba(0,0,0,0.05);background-color:#fff;}button{font-family:"Mali",cursive;font-size:16px;background-color:#ff7094;color:white;border:none;border-radius:6px;cursor:pointer;display:block;font-weight:bold;}.btn-generate{background-color:#ff7094;color:white;padding:12px 20px;border:none;border-radius:6px;cursor:pointer;font-weight:bold;font-size:16px;transition:background-color 0.3s ease;display:block;margin:10px auto 0 auto;}.btn-generate:hover{background-color:#da4b63;}#preview{margin-bottom:30px;display:flex;flex-wrap:wrap;gap:15px;justify-content:center;}.preview-image{width:150px;height:150px;object-fit:cover;border:2px solid #eee;border-radius:8px;box-shadow:0 4px 10px rgba(0,0,0,0.1);background-color:#fff;}.preview-container{position:relative;display:inline-block;}.error-overlay{position:absolute;top:0;left:0;background:rgba(255,0,0,0.75);color:white;padding:4px 6px;font-size:13px;font-weight:bold;border-top-left-radius:8px;border-bottom-right-radius:8px;}.created-link-input{width:80%;padding:8px;border:1px solid #ff7094;border-radius:6px;font-family:"Mali",cursive;font-weight:bold;color:#ff7094;background-color:#ffe6f0;cursor:text;display:block;margin:10px auto;}.custom-upload-button{font-family:"Mali",cursive;display:block;margin:10px auto;padding:12px 18px;background-color:#ff7094;color:white;border-radius:6px;font-weight:bold;font-size:16px;cursor:pointer;transition:background-color 0.3s ease;box-shadow:0 4px 10px rgba(0,0,0,0.1);user-select:none;text-align:center;width:30%;}.custom-upload-button:hover{background-color:#da4b63;}#captcha-popup{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);align-items:center;justify-content:center;z-index:9999;}#captcha-popup>div{background:white;padding:25px 30px;border-radius:10px;max-width:320px;width:90%;text-align:center;box-shadow:0 5px 15px rgba(0,0,0,0.3);}#captcha-code{font-family:"Mali",cursive;font-size:28px;font-weight:bold;letter-spacing:5px;background:#ffbbbb;padding:10px 20px;user-select:none;border-radius:6px;}#refresh-captcha{margin-left:10px;padding:16px;border:none;border-radius:6px;background:#ff7094;color:white;cursor:pointer;}#captcha-input{width:100%;padding:10px;font-size:16px;border:2px solid #ff7094;border-radius:6px;margin-top:15px;box-sizing:border-box;text-align:center;text-align-last:center;}#captcha-error{color:red;margin-top:10px;min-height:20px;}.button-wrapper{display:flex;justify-content:center;}#captcha-submit{background:#ff7094;color:white;border:none;border-radius:6px;padding:10px 20px;font-weight:bold;cursor:pointer;}.ringtext-container>div{display:flex;align-items:center;margin-bottom:6px;}.ring-text-input{flex:1;padding:8px;border:1px solid #ccc;border-radius:6px;font-size:14px;outline:none;text-align:center;font-family:"Mali",cursive;font-weight:600;}.ring-text-input:focus{border-color:#ff7094;box-shadow:0 0 0 2px rgba(0,119,204,0.2);}.ringtext-section{margin-bottom:20px;}.ringtext-section button{margin-left:6px;}.remove-ring-btn{background-color:#ff7094;color:white;border:none;border-radius:6px;padding:6px 10px;font-size:14px;cursor:pointer;}.remove-ring-btn:hover{background-color:#e04040;}.button-wrapper{text-align:center;margin-top:8px;}.add-ring-btn{margin-top:8px;padding:10px 14px;background-color:#ff7094;color:white;border:none;border-radius:6px;font-size:14px;font-weight:600;cursor:pointer;display:inline-block;}.add-ring-btn:hover{background-color:#ff507c;}.custom-label{display:block;margin-bottom:6px;font-weight:600;font-size:15px;color:#333;}.select-wrapper{text-align:center;margin-top:10px;}.custom-select{font-family:"Mali",cursive;font-weight:600;width:100%;max-width:300px;padding:8px 12px;font-size:15px;border:2px solid #ff7094;border-radius:6px;background-color:white;color:#333;cursor:pointer;appearance:none;background-image:url("data:image/svg+xml;utf8,<svg fill='%230077cc' height='24' viewBox='0 0 24 24' width='24' xmlns='http://www.w3.org/2000/svg'><path d='M7 10l5 5 5-5z'/></svg>");background-repeat:no-repeat;background-position:right 12px center;background-size:16px 16px;margin:0 auto;display:block;text-align:center;text-align-last:center;}.custom-select:focus{outline:none;border-color:#ff7094;box-shadow:0 0 6px #ff7094;}footer{text-align:center;margin:0 auto;color:rgb(138,138,138);font-weight:600;font-size:0.9rem;}@media (max-width:500px){.preview-image{width:100px;height:100px;}.custom-upload-button{width:60%;}}
    </style>

<body>
    <div id="devlekimlam"></div><div id="Devpan" style="display:none"></div>

<div id="loading-screen"><div class="spinner"></div><div id="loading-text">Loading</div></div><div class="container"><h1>Tạo tinh cầu ảnh</h1><div class="instructions">Lưu ý:<br /> Nhớ ấn copy link trước khi chuyển qua tạo QR<br /> Nếu muốn tạo web riêng nhắn tin qua mình </div><div class="ringtext-section"><label style="font-weight: bold; display: block; margin-bottom: 6px;">Nhập chữ xoay quanh tinh cầu</label><div id="ring-texts-container" class="ringtext-container"></div><div class="button-wrapper"><button type="button" class="add-ring-btn" onclick="addRingTextInput()">➕ Thêm câu</button><div id="ring-texts-container"></div></div></div><label style="font-weight: bold; display: block; margin-bottom: 6px; text-align: center;"> Thêm ảnh xoay quanh tinh cầu</label><label for="upload-imgbb" class="custom-upload-button">📷 Upload ảnh</label><input type="file" id="upload-imgbb" accept="image/*" multiple hidden><textarea style="display: none;" id="image-links" rows="4" placeholder="Nhập link ảnh tại đây..."></textarea><br /><div id="preview"></div><label for="music" class="custom-label">Chọn nhạc:</label><div class="select-wrapper"><select id="music" name="music" required class="custom-select"><option value="" disabled selected>-- Chọn nhạc --</option><option value="n/a.mp3">Nhac nền</option><option value="n/k.mp3">Kho Báu</option><option value="n/e.mp3">Lễ đường</option><option value="n/c.mp3">Chạm vào mây</option><option value="n/s.mp3">Happy birthday</option><option value="n/g.mp3">Không Thời Gian</option><option value="n/t.mp3">Từng Ngày Yêu Em</option><option value="n/d.mp3">Tình Yêu Giữa Mùa Đông</option></select></div><button id="generate-link" class="btn-generate">Tạo link</button><div id="created-link"></div><div id="captcha-popup"><div><h3>Vui lòng nhập CAPTCHA</h3><div style="margin:15px 0; display: flex; align-items: center; gap: 10px;"><span id="captcha-code"></span><button id="refresh-captcha" title="Làm mới CAPTCHA">🔄</button></div><input type="text" id="captcha-input" placeholder="Nhập mã xác thực.." autocomplete="off" /><div id="captcha-error"></div><div class="button-wrapper"><button id="captcha-submit">Gửi mã</button></div></div></div></div>
    <script>
        // Loading screen fadeout
        window.addEventListener('load', () => {
            setTimeout(() => {
                const ls = document.getElementById('loading-screen');
                if (ls) ls.style.display = 'none';
            }, 300);
        });

        
    </script>
    <script src="./app/galaxylove.js"></script>
