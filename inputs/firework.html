    <style>
*{box-sizing:border-box;}html,body{width:100%;overflow-x:hidden;}body{font-family:"Mali",cursive;background:linear-gradient(135deg,#ffdfdf,#ffe7e7);margin:0;padding:20px;color:#333;}.container{max-width:620px;margin:auto;padding:20px;background:rgba(255,255,255,0.92);backdrop-filter:blur(10px);border-radius:22px;box-shadow:0 18px 45px rgba(177,62,62,0.25);}h2{text-align:center;font-size:32px;font-weight:800;color:#b13e3e;font-weight:800;letter-spacing:1px;}.box{background:linear-gradient(135deg,#ffffff,#fff2f2);border-radius:16px;padding:18px 20px;margin-bottom:18px;border:1px solid #ffd7d7;}label{font-weight:700;color:#ce5b5b;font-size:16px;}input[type="text"],textarea{width:100%;padding:12px 14px;border-radius:12px;border:1px solid #f5c7c7;margin-top:6px;font-size:15px;font-family:"Mali",cursive;transition:0.25s;}input[type="text"]:focus,textarea:focus{border-color:#d87373;box-shadow:0 0 0 3px rgba(216,115,115,0.25);outline:none;}.text-row{display:flex;align-items:center;gap:8px;margin-top:10px;}.remove-btn{background:linear-gradient(135deg,#ff5f6d,#ff3b3b);color:#fff;border:none;height:36px;padding:0 14px;border-radius:10px;font-size:20px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:0.25s;}.remove-btn:hover{transform:translateY(-1px);box-shadow:0 6px 15px rgba(255,59,59,0.45);}.remove-btn:disabled{opacity:0.4;cursor:not-allowed;box-shadow:none;transform:none;}.add-btn{display:block;margin:14px auto 0;}.box>button{margin-top:14px;padding:10px 18px;background:linear-gradient(135deg,#ff5f6d,#ff3b3b);color:#fff;border:none;border-radius:999px;font-size:14px;cursor:pointer;transition:0.25s;font-family:"Mali",cursive;}.box>button:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(122,62,177,0.35);}.custom-upload-button{display:inline-block;padding:12px 18px;background:linear-gradient(135deg,#ff5f6d,#ff3b3b);color:white;border-radius:999px;cursor:pointer;font-weight:600;transition:0.25s;}.custom-upload-button:hover{transform:scale(1.05);}#preview{border:2px dashed #ffaaaa;padding:14px;border-radius:16px;min-height:120px;display:flex;flex-wrap:wrap;gap:12px;margin-top:14px;justify-content:center;}.preview-item{position:relative;display:inline-block;}.preview-item img{width:110px;height:110px;object-fit:cover;border-radius:14px;box-shadow:0 10px 25px rgba(0,0,0,0.18);}.preview-item button{position:absolute;top:6px;right:6px;width:28px;height:28px;padding:0;font-size:18px;font-weight:700;color:#fff;background:linear-gradient(135deg,#ff5f6d,#ff3b3b);border:none;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:0.25s;}.preview-item button:hover{transform:scale(1.1);box-shadow:0 4px 12px rgba(255,59,59,0.5);}#createLinkBtn{padding:12px 20px;background:linear-gradient(135deg,#ff5f6d,#ff3b3b);color:#fff;border-radius:999px;font-size:16px;font-weight:700;cursor:pointer;transition:0.25s;font-family:"Mali",cursive;}#createLinkBtn:hover{transform:translateY(-3px);box-shadow:0 12px 35px rgba(177,62,62,0.45);}#resultBox{margin-top:22px;padding:18px;background:linear-gradient(135deg,#ffffff,#fff5f5);border-radius:20px;display:none;flex-direction:column;gap:12px;border:1px solid #ffd7d7;box-shadow:0 10px 25px rgba(255,95,109,0.1);}#generatedLink{width:100%;box-sizing:border-box;padding:12px 15px;border-radius:12px;border:1.5px solid #ffcfcf;background:#ffffff;font-size:14px;font-family:"Mali",cursive;color:#666;outline:none;}.result-buttons{display:flex;gap:10px;width:60%;margin:0 auto;justify-content:center;}#copyBtn,#viewBtn{flex:1;padding:12px;border-radius:12px;font-weight:600;cursor:pointer;transition:all 0.3s ease;font-family:"Mali",cursive;font-size:14px;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;border:none;}#copyBtn{background:#0a2f66;color:#fff;}#copyBtn:hover{background:#061e42;transform:translateY(-2px);}#viewBtn{background:linear-gradient(135deg,#ff5f6d,#ff3b3b);color:#fff;}#viewBtn:hover{transform:translateY(-2px);box-shadow:0 5px 15px rgba(255,59,59,0.3);}#captcha-popup{font-family:"Mali",cursive;position:fixed;inset:0;display:none;justify-content:center;align-items:center;background:rgba(0,0,0,0.75);backdrop-filter:blur(6px);z-index:99999;}#captcha-box{background:linear-gradient(135deg,#ffffff,#ffecec);padding:24px 22px;border-radius:18px;text-align:center;width:320px;animation:popupZoom 0.35s ease;box-shadow:0 25px 60px rgba(0,0,0,0.45),0 0 0 4px rgba(216,115,115,0.15);}#captcha-code{font-weight:800;font-size:26px;letter-spacing:6px;margin-bottom:12px;display:block;color:#b13e3e;}#captcha-box input{width:100%;padding:12px;border-radius:10px;border:1px solid #f5c7c7;font-size:15px;margin-bottom:8px;}#captcha-box input:focus{outline:none;border-color:#d87373;box-shadow:0 0 0 3px rgba(216,115,115,0.25);}#captcha-error{color:#ff3b3b;font-size:14px;min-height:18px;}#captcha-box button{padding:10px 18px;margin:6px 4px 0;border-radius:999px;border:none;cursor:pointer;font-family:"Mali",cursive;font-weight:600;transition:.25s;}#captcha-submit{background:linear-gradient(135deg,#ff5f6d,#ff3b3b);color:white;}#captcha-submit:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(122,62,177,.45);}#refresh-captcha{background:linear-gradient(135deg,#ff5f6d,#ffa7a7);}@keyframes popupZoom{from{transform:scale(0.8);opacity:0;}to{transform:scale(1);opacity:1;}}@media (max-width:600px){body{padding:12px;}.container{padding:18px;border-radius:18px;}h2{font-size:24px;}.text-row{gap:6px;}.remove-btn{width:40px;height:40px;font-size:22px;}#preview img{width:80px;height:80px;}#copyBtn{width:30%;}#resultBox{flex-direction:column;}#captcha-box{width:calc(100% - 40px);}#captcha-code{font-size:22px;letter-spacing:4px;}}
    </style>
</head>
<body>

<div id="loading-screen"><div class="spinner"></div><div id="loading-text">Loading</div></div><div class="container"><h2>T?o thông di?p</h2><div class="box"><label>Nh?p l?i chúc</label><br><div id="textListBox"></div><button onclick="addTextField()" class="add-btn"> ? Thêm l?i chúc </button></div><div class="box" style="text-align:center;"><label for="upload-imgbb" class="custom-upload-button">?? Upload ?nh</label><input type="file" id="upload-imgbb" accept="image/*" multiple hidden><textarea id="image" rows="4" placeholder="Nh?p link ?nh t?i dây..." style="display:none;"></textarea><div id="preview"></div></div><div style="display: flex; justify-content: center; margin-top: 20px;"><button id="createLinkBtn" onclick="createLink()">T?o Link</button></div><div id="resultBox"><input id="generatedLink" readonly placeholder="Link s? xu?t hi?n ? dây..."><div class="result-buttons"><a id="viewBtn" target="_blank"><i class="fa-solid fa-eye"></i> Xem trang </a><button id="copyBtn" onclick="copyLink()"><i class="fa-solid fa-copy"></i> Copy </button></div></div></div></div><!-- CAPTCHA --><div id="captcha-popup"><div id="captcha-box"><div id="captcha-code"></div><input type="text" id="captcha-input" placeholder="Nh?p CAPTCHA"><div id="captcha-error"></div><button id="captcha-submit">Xác nh?n</button><button id="refresh-captcha">??</button></div>
