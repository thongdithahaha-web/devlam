<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="author" content="devlekimlam">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tạo Chữ Tình Yêu Phiên Bản 2</title>
    <link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;600;700&family=Playpen+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="icon" href="../assets/logo.png" type="image/png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.5.0/lz-string.min.js"></script>
    <script src="../assets/keypan.js"></script>
    <style>
*{box-sizing:border-box;}:root{--pink-main:#ff6f91;--pink-light:#ffcdd2;--pink-bg:#fff1f3;--white:#ffffff;--text-color:#0a0a0a;--border-color:#ffd1d9;--shadow:rgba(255,100,130,0.15);}html,body{margin:0;padding:0;min-height:100%;}body{background:linear-gradient(135deg,#ffbdbd);color:var(--text-color);font-family:"Mali",cursive;display:flex;flex-direction:column;justify-content:center;align-items:center;min-height:100vh;padding:2rem 1rem;}.container{background:var(--white);padding:2rem;border-radius:18px;box-shadow:0 6px 20px var(--shadow);max-width:650px;width:100%;transition:transform 0.2s ease,box-shadow 0.3s ease;}.container:hover{transform:translateY(-2px);box-shadow:0 10px 25px rgba(255,100,130,0.2);}h1{text-align:center;font-size:1.9rem;font-weight:700;margin:0 0 1.5rem;color:var(--pink-main);}label{display:block;margin:1rem 0 0.4rem;font-weight:600;color:var(--pink-main);}input[type="text"],select,textarea{width:100%;padding:10px 14px;border-radius:10px;border:1.8px solid var(--border-color);background:var(--white);color:var(--text-color);font-family:"Mali",cursive;font-size:1rem;transition:all 0.25s ease;}input:focus,select:focus,textarea:focus{border-color:var(--pink-main);box-shadow:0 0 6px rgba(255,111,145,0.2);outline:none;}.message-group{display:flex;align-items:center;margin-bottom:6px;}.message-input{flex:1;padding:8px 10px;border-radius:8px;}.remove-btn{background:#ff4d4d;border:none;color:#fff;font-weight:bold;border-radius:8px;margin-left:5px;cursor:pointer;transition:background 0.2s ease;}.remove-btn:hover{background:#e84343;}button,#addMessageBtn,#captcha-submit{font-family:"Mali",cursive;background-color:var(--pink-main);color:#fff;border:none;border-radius:10px;font-weight:600;cursor:pointer;padding:12px 20px;transition:all 0.25s ease;}button:hover,#addMessageBtn:hover,#captcha-submit:hover{background-color:#ff4c6d;transform:scale(1.03);box-shadow:0 4px 10px rgba(255,111,145,0.3);}#addMessageBtn{margin:0.8rem auto 0 auto;display:block;width:30%;}button[type="submit"]{background:var(--pink-main);color:#fff;width:30%;margin:1.5rem auto 0;display:block;}#musicSelect{display:block;width:60%;margin:1.5rem auto 0;text-align:center;text-align-last:center;color:var(--text-color);font-weight:600;}.result-container{margin-top:1.5rem;display:none;flex-direction:column;gap:10px;width:100%;}.result-link{width:100%;border-radius:8px;background:#fff6f7;padding:10px;border:1px solid var(--border-color);color:var(--pink-main);text-align:center;}.action-buttons{display:flex;gap:10px;justify-content:center;width:100%;}.action-btn{flex:1;background:var(--pink-main);color:#fff;border:none;border-radius:8px;padding:10px 14px;cursor:pointer;font-family:"Mali",cursive;font-weight:600;font-size:0.95rem;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:all 0.2s ease;}.action-btn:hover{background:#ff4c6d;transform:scale(1.02);}#captcha-popup{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.45);backdrop-filter:blur(4px);align-items:center;justify-content:center;z-index:9999;}#captcha-popup>div{background:#fff;padding:25px 30px;border-radius:16px;box-shadow:0 8px 25px rgba(255,121,148,0.3);max-width:340px;width:90%;text-align:center;animation:fadeInPopup 0.3s ease;border:2px solid #ffd4dc;}@keyframes fadeInPopup{from{opacity:0;transform:scale(0.9);}to{opacity:1;transform:scale(1);}}#captcha-popup h3{margin:0 0 12px;color:#ff5c7c;font-weight:700;font-size:1.2rem;}#captcha-code{display:inline-block;font-family:"Mali",cursive;font-size:26px;font-weight:bold;letter-spacing:5px;color:#fff;background:linear-gradient(135deg,#ff7fa3,#ffb6c6);padding:10px 18px;border-radius:8px;user-select:none;box-shadow:0 4px 10px rgba(255,121,148,0.3);}#refresh-captcha{background:#ff7fa3;border:none;color:#fff;border-radius:8px;padding:10px 12px;font-size:1.1rem;cursor:pointer;transition:background 0.2s ease,transform 0.2s ease;}#refresh-captcha:hover{background:#ff507c;transform:rotate(10deg);}#captcha-input{width:100%;padding:10px 12px;margin-top:15px;border:2px solid #ffb6c1;border-radius:10px;text-align:center;font-size:1rem;font-family:"Mali",cursive;transition:all 0.2s ease;}#captcha-input:focus{border-color:#ff7094;box-shadow:0 0 6px rgba(255,121,148,0.3);outline:none;}#captcha-error{color:red;font-size:0.9rem;min-height:18px;}.button-wrapper{display:flex;justify-content:center;margin-top:12px;}#captcha-submit{background:#ff7fa3;color:white;border:none;border-radius:10px;padding:10px 18px;font-weight:600;cursor:pointer;transition:all 0.25s ease;}#captcha-submit:hover{background:#ff507c;transform:scale(1.05);}.footer{margin-top:10px;text-align:center;font-size:1rem;color:#999;opacity:0.8;transition:color 0.3s ease;}.footer:hover{color:#ff5c7c;opacity:1;}@media (max-width:480px){.container{padding:1.5rem;}button,#addMessageBtn,button[type="submit"]{width:80%;font-size:0.95rem;}#musicSelect{width:80%;}.action-btn{font-size:0.85rem;padding:10px 8px;}}
    </style>
</head>
<body>
    <div id="devlekimlam"></div><div id="Devpan" style="display:none"></div>

<div id="loading-screen"><div class="spinner"></div><div id="loading-text">Loading</div></div><div class="container"><h1>Nhập nội dung</h1><form id="contentForm"><label for="mainText">Câu chính:</label><input type="text" id="mainText" name="mainText" placeholder="Anh yêu em..." required><label for="subText">Câu phụ:</label><input type="text" id="subText" name="subText" placeholder="Dù ở vũ trụ nào anh vẫn yêu em" required><label>Thông điệp trên rơi xuống:</label><div id="messagesInputs"><div class="message-group"><input type="text" name="message" placeholder="Câu 1" required class="message-input"></div><div class="message-group"><input type="text" name="message" placeholder="Câu 2" required class="message-input"></div></div><button type="button" id="addMessageBtn">+ Thêm câu</button><label for="musicSelect" style="margin-top: 1.5rem;">Chọn nhạc nền:</label><select id="musicSelect" name="music"><option value="">-- Không chọn --</option><option value="a/1.mp3">Happy birthday</option><option value="a/2.mp3">Phép màu</option><option value="a/3.mp3">Lễ đường</option><option value="a/4.mp3">Từng ngày yêu em</option></select><button type="submit">Tạo link</button><!-- Hàng trên là ô chứa Link, Hàng dưới chứa 2 Nút Copy và Xem link --><div id="resultContainer" class="result-container"><input type="text" id="resultLink" readonly class="result-link"><div class="action-buttons"><button type="button" id="copyBtn" class="action-btn">Copy</button><button type="button" id="viewBtn" class="action-btn">Xem trang</button></div></div></form></div><div id="captcha-popup"><div><h3>Vui lòng nhập CAPTCHA</h3><div style="margin:15px 0; display: flex; align-items: center; gap: 10px;"><span id="captcha-code"></span><button id="refresh-captcha" title="Làm mới CAPTCHA">🔄</button></div><input type="text" id="captcha-input" placeholder="Nhập mã xác thực.." autocomplete="off" /><div id="captcha-error"></div><div class="button-wrapper"><button id="captcha-submit">Gửi mã</button></div></div></div><footer class="footer"><p>© 2026 devlekimlam. A personal creation.</p></footer>

    <script>
        // Loading screen fadeout
        window.addEventListener('load', () => {
            setTimeout(() => {
                const ls = document.getElementById('loading-screen');
                if (ls) ls.style.display = 'none';
            }, 300);
        });

        
    </script>
    <script src="./js/textlovev2.js"></script>
</body>
</html>
