<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="author" content="devlekimlam">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tạo Thông Điệp Tình Yêu Nhỏ</title>
    <link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;600;700&family=Playpen+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="icon" href="../assets/logo.png" type="image/png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.5.0/lz-string.min.js"></script>
    <script src="../assets/keypan.js"></script>
    <script src="../assets/upload-audio.js"></script>
    <style>
:root{--primary-blue:#5baed4;--primary-blue-dark:#3d91b8;--primary-pink:#ff75a0;--text-dark:#2d3436;--text-muted:#636e72;--bg-light:#f7f9fc;--border-soft:#e3eef5;}*{box-sizing:border-box;font-family:'Playpen Sans',cursive;}body{margin:0;padding:24px;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f1f1f1;}.card{width:100%;max-width:520px;background:#fff;border-radius:26px;padding:32px 22px;box-shadow:0 10px 25px rgba(0,0,0,0.08),0 30px 60px rgba(0,0,0,0.06);border:1px solid rgba(255,255,255,0.8);animation:fadeIn 0.45s ease-out;}@keyframes fadeIn{from{opacity:0;transform:translateY(12px) scale(0.98);}to{opacity:1;transform:translateY(0) scale(1);}}h2{text-align:center;margin:0 0 22px;font-size:26px;color:var(--primary-blue-dark);}label{display:block;margin:16px 0 6px 6px;font-size:13px;font-weight:700;color:var(--text-muted);}.line{display:flex;gap:10px;margin-bottom:12px;}.line input{flex:1;padding:13px 16px;border-radius:14px;border:2px solid var(--border-soft);font-size:15px;color:var(--text-dark);background:#fbfdff;transition:0.2s;}.line input:focus{outline:none;border-color:var(--primary-blue);box-shadow:0 0 0 4px rgba(91,174,212,0.15);}.btn-del{width:44px;border-radius:14px;border:none;background:#fff0f4;color:#d63031;font-weight:800;cursor:pointer;transition:0.2s;}.btn-del:hover{background:#ffe3ea;transform:scale(1.05);}#addBtn{display:block;width:65%;margin:14px auto 24px;padding:13px;border-radius:14px;border:2px dashed var(--primary-blue);background:linear-gradient(180deg,#f4fbff,#eaf6ff);color:var(--primary-blue-dark);font-weight:800;cursor:pointer;transition:0.25s;}#addBtn:hover{background:linear-gradient(180deg,#eaf6ff,#dff1ff);transform:translateY(-1px);}select{display:block;width:85%;margin:0 auto 26px;padding:13px;border-radius:14px;border:2px solid var(--border-soft);background:#fbfdff;text-align:center;text-align-last:center;font-weight:600;cursor:pointer;}select:focus{outline:none;border-color:var(--primary-blue);box-shadow:0 0 0 4px rgba(91,174,212,0.15);}.action-create{display:block;width:65%;margin:0 auto;padding:15px;border-radius:18px;border:none;background:linear-gradient(135deg,var(--primary-blue),var(--primary-blue-dark));color:#fff;font-size:16px;font-weight:800;cursor:pointer;box-shadow:0 12px 25px rgba(61,145,184,0.35);transition:0.3s;}.action-create:hover{transform:translateY(-2px);box-shadow:0 18px 35px rgba(61,145,184,0.45);}#generatedLink{margin-top:26px;padding:16px;border-radius:18px;background:#f8fafc;border:1px solid #e4ecf2;display:none;}#generatedURL{width:100%;padding:13px 16px;margin:14px 0;border-radius:14px;border:1.5px solid var(--border-soft);background:#fff;text-align:center;font-family:'Courier New',monospace;font-size:13px;color:#444;}.button-group{display:flex;gap:12px;}.btn-view,.btn-copy{flex:1;padding:13px;border-radius:14px;border:none;font-weight:800;cursor:pointer;color:#fff;transition:0.25s;}.btn-view{background:linear-gradient(135deg,#74b9ff,#4aa3ff);}.btn-view:hover{transform:translateY(-1px);}.btn-copy{background:linear-gradient(135deg,#ff75a0,#ff4f87);}.btn-copy:hover{transform:translateY(-1px);}.footer-note{text-align:center;font-size:12px;color:#888;margin-top:20px;}.donate-container{margin-top:15px;text-align:center;font-family:"Mali",cursive;}.donate-message{font-size:14px;font-weight:600;color:#ff4444;user-select:none;border:1.5px dashed #ff4444;padding:12px 15px;border-radius:8px;margin-bottom:10px;background-color:#fffafa;}.button-group{display:flex;justify-content:center;gap:15px;}.btn-donate{font-family:'Playpen Sans',cursive;background-color:#ff6565;color:white;border:none;border-radius:8px;padding:12px 24px;cursor:pointer;font-weight:600;transition:all 0.25s cubic-bezier(0.4,0,0.2,1);}.btn-donate:hover{background-color:#ff4444;transform:translateY(-2px);box-shadow:0 4px 12px rgba(255,68,68,0.2);}.modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;width:100vw;height:100vh;z-index:100000;background-color:rgba(0,0,0,0.75);backdrop-filter:blur(4px);align-items:center;justify-content:center;padding:20px;box-sizing:border-box;}.modal-content{background:white;padding:30px 25px;border-radius:24px;width:100%;max-width:380px;text-align:center;position:relative;box-shadow:0 20px 40px rgba(0,0,0,0.3);animation:modalPop 0.3s cubic-bezier(0.34,1.56,0.64,1);}@keyframes modalPop{from{opacity:0;transform:scale(0.8) translateY(20px);}to{opacity:1;transform:scale(1) translateY(0);}}.close-btn-dn{position:absolute;right:15px;top:10px;font-size:24px;cursor:pointer;color:#bbb;line-height:1;transition:color 0.2s;}.close-btn-dn:hover{color:#333;}.modal-title{margin:0 0 5px;color:#ff4444;font-size:22px;}.qr-code-wrapper{background:#fdfdfd;padding:15px;border-radius:16px;margin:15px 0;border:1px solid #eee;}.qr-code-wrapper img{width:100%;max-width:220px;border-radius:8px;display:block;margin:0 auto;}.bank-info-box{background:#fff8f8;padding:15px;border-radius:12px;border:1px solid #ffebeb;}.bank-details{font-size:14px;margin-bottom:12px;line-height:1.6;color:#444;}.stk-copy-row{display:flex;align-items:center;justify-content:space-between;background:white;padding:10px 15px;border-radius:10px;border:1px solid #ddd;}#stk-number{font-weight:800;color:#222;font-size:18px;letter-spacing:0.5px;flex:1;text-align:center;}.btn-copy-dn{background:#ff6565;color:white;border:none;padding:8px 16px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:700;}body.modal-open{overflow:hidden;}
    </style>
</head>
<body>
    <div id="devlekimlam"></div><div id="Devpan" style="display:none"></div>

<div id="loading-screen"><div class="spinner"></div><div id="loading-text">Loading</div></div><div class="card"><h2>Nhập thông điệp</h2><label>✨ Nội dung lời chúc:</label><div id="lines"></div><button id="addBtn">＋ Thêm dòng mới</button><label>🎵 Chọn nhạc nền:</label><select id="musicInput"><option value="">-- Không chọn --</option><option value="a/1.mp3">Happy birthday</option><option value="a/2.mp3">Phép màu</option><option value="a/3.mp3">Lễ đường</option><option value="a/4.mp3">Từng ngày yêu em</option></select><button class="action-create" id="createBtn">Tạo Link</button><div id="generatedLink"><label style="margin-top:0">Kết quả của bạn:</label><input type="text" id="generatedURL" readonly placeholder="Link của bạn sẽ hiện ở đây..."><div class="button-group"><button class="btn-view" id="viewBtn">Xem trang</button><button class="btn-copy" id="copyBtn">Copy</button></div></div><p class="footer-note">© 2026 devlekimlam - Handmade with love for your girl 🤍</p></div>

    <script>
        // Loading screen fadeout
        window.addEventListener('load', () => {
            setTimeout(() => {
                const ls = document.getElementById('loading-screen');
                if (ls) ls.style.display = 'none';
            }, 300);
        });

        
    </script>
    <script src="./js/littlelove.js"></script>
</body>
</html>
