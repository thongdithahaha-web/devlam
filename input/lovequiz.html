    <style>
        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            font-weight: 600;
            background-color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            font-size: 24px;
            color: #555;
            flex-direction: column;
        }

        .spinner {
            border: 8px solid #f3f3f3;
            border-top: 8px solid #ff7094;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1.2s linear infinite;
            margin-bottom: 15px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        /* Layout chính */
        .donate-container {
            margin-top: 15px;
            text-align: center;
            font-family: 'Playpen Sans', cursive;
        }

        .donate-message {
            font-size: 14px;
            font-weight: 600;
            color: #ff4444;
            user-select: none;
            border: 1.5px dashed #ff4444;
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            background-color: #fffafa;
        }

        .button-group {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .btn-donate {
            font-family: 'Playpen Sans', cursive;
            background-color: #ff6565;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 24px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-donate:hover {
            background-color: #ff4444;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(255, 68, 68, 0.2);
        }

        /* Popup Overlay - Đảm bảo phủ toàn màn hình */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100vw;
            height: 100vh;
            z-index: 100000;
            background-color: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(4px);
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
        }

        /* Nội dung Popup */
        .modal-content {
            background: white;
            padding: 30px 25px;
            border-radius: 24px;
            width: 100%;
            max-width: 380px;
            text-align: center;
            position: relative;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            animation: modalPop 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes modalPop {
            from {
                opacity: 0;
                transform: scale(0.8) translateY(20px);
            }

            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .close-btn-dn {
            position: absolute;
            right: 15px;
            top: 10px;
            font-size: 24px;
            cursor: pointer;
            color: #bbb;
            line-height: 1;
            transition: color 0.2s;
        }

        .close-btn-dn:hover {
            color: #333;
        }

        .modal-title {
            margin: 0 0 5px;
            color: #ff4444;
            font-size: 22px;
        }

        .qr-code-wrapper {
            background: #fdfdfd;
            padding: 15px;
            border-radius: 16px;
            margin: 15px 0;
            border: 1px solid #eee;
        }

        .qr-code-wrapper img {
            width: 100%;
            max-width: 220px;
            border-radius: 8px;
            display: block;
            margin: 0 auto;
        }

        .bank-info-box {
            background: #fff8f8;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid #ffebeb;
        }

        .bank-details {
            font-size: 14px;
            margin-bottom: 12px;
            line-height: 1.6;
            color: #444;
        }

        .stk-copy-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: white;
            padding: 10px 15px;
            border-radius: 10px;
            border: 1px solid #ddd;
        }

        #stk-number {
            font-weight: 800;
            color: #222;
            font-size: 18px;
            letter-spacing: 0.5px;
            flex: 1;
            text-align: center;
        }

        .btn-copy-dn {
            background: #ff6565;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 700;
        }

        body.modal-open {
            overflow: hidden;
        }
    </style>
