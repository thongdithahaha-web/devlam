    <style>
*,*::before,*::after{box-sizing:border-box;}body{font-family:'Playpen Sans',cursive;background:linear-gradient(135deg,#fff0f3,#fff7fa);margin:0;padding:30px 10px;display:flex;justify-content:center;min-height:100vh;overflow-x:hidden;flex-direction:column;align-items:center;}.container{background-color:#ffffff;padding:30px 20px;border-radius:16px;box-shadow:0 8px 24px rgba(255,105,135,0.2);max-width:600px;width:100%;box-sizing:border-box;text-align:center;}h2{font-family:'Playpen Sans',cursive;color:hsl(0,100%,76%);margin-bottom:25px;font-size:24px;}.form-group{margin-bottom:18px;text-align:left;}label{display:block;font-weight:600;margin-bottom:6px;color:#ff8989;font-size:16px;}input[type="text"]{font-family:'Playpen Sans',cursive;width:100%;min-width:0;padding:12px 14px;border:1px solid #ddd;border-radius:10px;box-shadow:0 2px 5px rgba(0,0,0,0.05);font-size:15px;transition:border 0.3s ease;word-wrap:break-word;overflow-wrap:break-word;}input[type="text"]:focus{border-color:#f48fb1;outline:none;}.input-row{display:flex;flex-wrap:wrap;gap:15px;justify-content:center;}.input-row .form-group{flex:1 1 100%;}@media screen and (min-width:600px){.input-row .form-group{flex:1 1 45%;}}button{font-family:'Playpen Sans',cursive;padding:12px 24px;background:linear-gradient(to right,#f48f8f,#ff6068);border:none;border-radius:30px;color:white;font-weight:bold;font-size:16px;cursor:pointer;transition:background 0.3s ease;box-shadow:0 4px 12px rgba(236,64,122,0.4);}button:hover{background:linear-gradient(to right,#ff6c6c,#ff6068);}#donateBox{display:none;margin-top:20px;font-size:22px;color:#e91e63;font-weight:500;animation:fadeIn 0.5s ease-in-out;}#linkOutput{margin-top:12px;color:#6a1b9a;word-wrap:break-word;font-size:15px;}#qrBox{display:none;margin-top:25px;text-align:center;}#downloadQRButton{display:none;margin-top:12px;padding:10px 20px;border-radius:20px;border:none;background-color:#ce93d8;color:white;cursor:pointer;transition:background 0.3s ease;box-shadow:0 2px 8px rgba(156,39,176,0.2);}#downloadQRButton:hover{background-color:#ab47bc;}@keyframes fadeIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}.site-footer{margin-top:10px;text-align:center;border-top:1px solid rgba(255,118,117,0.2);width:100%;}.site-footer p{font-family:'Playpen Sans',cursive;font-size:0.9rem;color:#a1a1a1;letter-spacing:0.5px;display:flex;align-items:center;justify-content:center;gap:6px;}.site-footer p b,.site-footer span{color:#ff7675;display:inline-block;animation:heartBeat 1.5s infinite;}@keyframes heartBeat{0%{transform:scale(1);}14%{transform:scale(1.3);}28%{transform:scale(1);}42%{transform:scale(1.3);}70%{transform:scale(1);}}.site-footer p:hover{color:#ff7675;transition:color 0.3s ease;cursor:default;}
    </style>
</head>
<body>
    <div id="devlekimlam"></div><div id="Devpan" style="display:none"></div>

<div id="loading-screen"><div class="spinner"></div><div id="loading-text">Loading</div></div><div class="container"><h2>Nhập nội dung</h2><div class="form-group"><label for="lInput">Link ảnh chính: (bỏ trống để sử dụng ảnh mặc định)</label><input type="text" id="lInput" placeholder="https://lekimlamdev.vercel.app/image.jpg" /></div><div id="preview-main" class="image-preview"><img id="imgPreviewMain" /></div><div class="form-group"><label for="mInput">Link ảnh phụ (nhấn Yes): (bỏ trống để sử dụng ảnh mặc định)</label><input type="text" id="mInput" placeholder="https://lekimlamdev.vercel.app/yes.jpg" /></div><div id="preview-sub" class="image-preview"><img id="imgPreviewSub" /></div><div class="form-group"><label for="nInput">Lời chính:</label><input type="text" id="nInput" placeholder="Ví dụ: Tớ có điều này muốn nói..." /></div><div class="form-group"><label for="oInput">Lời phụ (khi nhấn Yes):</label><input type="text" id="oInput" placeholder="Ví dụ: Tớ thích cậu!" /></div><div class="input-row"><div class="form-group"><label for="g">Nội dung nút Yes:</label><input type="text" id="g" placeholder="Ví dụ: Yêu chứ!" /></div><div class="form-group"><label for="h">Nội dung nút No:</label><input type="text" id="h" placeholder="Ví dụ: Không đâu!" /></div></div><button onclick="generateLink()">Tạo Link</button><div id="linkOutput"></div><footer class="site-footer"><p>© 2025 <b>devlekimlam</b>. A personal creation. <span>🤍</span></p></footer></div>

        // Loading screen fadeout
        window.addEventListener('load', () => {
            setTimeout(() => {
                const ls = document.getElementById('loading-screen');
                if (ls) ls.style.display = 'none';
            }, 300);
        });

        
    </script>
