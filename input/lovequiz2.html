*{box-sizing:border-box;}html,body{height:100%;margin:0;padding:0;display:flex;flex-direction:column;}body{font-family:"Playpen Sans",cursive;max-width:600px;margin:40px auto 0;padding:0 15px;background:linear-gradient(135deg,#fff0f3,#fff7fa);color:#4a4a4a;text-align:center;user-select:none;}.container{max-width:600px;padding:20px 25px;background:#ffffff;border-radius:12px;box-shadow:0 10px 25px rgba(214,51,108,0.15);text-align:center;user-select:none;}h2{font-family:"Playpen Sans",cursive;font-size:28px;color:#ff8080;text-shadow:0 0 2px rgb(255,159,167);text-align:center;margin:20px auto;}label{display:block;font-weight:600;color:#ff8080;text-align:left;max-width:500px;margin:10px auto;}input[type="text"],textarea{font-family:"Playpen Sans",cursive;width:100%;max-width:500px;padding:10px 15px;font-size:1rem;border-radius:10px;border:1px solid #ff6673;box-shadow:inset 1px 1px 5px #ffeded;transition:border-color 0.3s ease;resize:vertical;outline:none;color:#4a4a4a;background-color:#ffffff00;}input[type="text"]:focus,textarea:focus{border-color:#ff8080;box-shadow:0 0 4px #afafaf88;background-color:#fffdfd;}textarea{min-height:100px;line-height:1.4;}button{font-family:"Playpen Sans",cursive;background:linear-gradient(135deg,#ff4d6d,#ff80aa);color:white;font-weight:bold;padding:8px 20px;border:none;border-radius:12px;cursor:pointer;font-size:1.1rem;transition:all 0.3s ease;box-shadow:0 6px 15px rgba(255,77,109,0.3);}button:hover{background:linear-gradient(135deg,#ff80aa,#ff4d6d);box-shadow:0 8px 18px rgba(255,77,109,0.5);}button:hover{background-color:#ff4c5b;}.btn-generate{padding:5px 10px;background-color:#ff6673;color:white;font-size:18px;border:none;border-radius:6px;cursor:pointer;transition:background-color 0.3s ease;}.btn-generate:hover{background-color:#ff4c5b;}.inline-labels{display:flex;gap:20px;align-items:center;}#resultLink{margin-top:25px;word-break:break-word;font-size:1rem;color:#ff6673;}.link-row{display:flex;justify-content:center;align-items:center;gap:10px;margin-top:15px;max-width:520px;margin-left:auto;margin-right:auto;}.link-row input{flex:1;padding:8px 12px;font-size:1rem;border-radius:6px;border:1.5px solid #ffffff;box-shadow:inset 0 0 8px #ffd9e6;outline:none;background-color:#fff0f6;color:#4a4a4a;user-select:all;}.copy-btn,.generate-btn{background:#ff6673;border:none;border-radius:6px;color:white;font-weight:600;font-size:0.9rem;cursor:pointer;transition:background-color 0.3s ease;user-select:none;}.copy-btn:hover,.generate-btn:hover{background-color:#ff4c5b;}select{font-family:"Playpen Sans",cursive;width:100%;max-width:500px;padding:12px 15px;font-size:1rem;border-radius:12px;border:1px solid #ff6673;box-shadow:inset 1px 1px 5px #ffeded;color:#4a4a4a;outline:none;transition:all 0.3s ease;appearance:none;background-image:url("data:image/svg+xml;charset=US-ASCII,%3Csvg xmlns='http://www.w3.org/2000/svg' width='16' height='16'%3E%3Cpath fill='%23ff4d6d' d='M4 6l4 4 4-4z'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 12px center;background-size:16px;cursor:pointer;text-align:center;text-align-last:center;}select:focus{border-color:#ff4d6d;box-shadow:0 0 10px rgba(255,77,109,0.3);background-color:#fff5f8;}@media (max-width:400px){select{font-size:0.9rem;padding:10px 12px;}}.site-footer{margin-top:10px;text-align:center;border-top:1px solid rgba(255,118,117,0.2);width:100%;}.site-footer p{font-family:'Playpen Sans',cursive;font-size:0.9rem;color:#a1a1a1;letter-spacing:0.5px;display:flex;align-items:center;justify-content:center;gap:6px;}.site-footer p b,.site-footer span{color:#ff7675;display:inline-block;animation:heartBeat 1.5s infinite;}@keyframes heartBeat{0%{transform:scale(1);}14%{transform:scale(1.3);}28%{transform:scale(1);}42%{transform:scale(1.3);}70%{transform:scale(1);}}.site-footer p:hover{color:#ff7675;transition:color 0.3s ease;cursor:default;}
