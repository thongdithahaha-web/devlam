<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="author" content="devlekimlam">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tạo Hiệu Ứng Chữ Động Trái Tim</title>
    <link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;600;700&family=Playpen+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="icon" href="../assets/logo.png" type="image/png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.5.0/lz-string.min.js"></script>
    <script src="../assets/keypan.js"></script>
    <style>
body{font-family:'Playpen Sans',cursive;background:linear-gradient(135deg,#fff9f3 0%,#ffe8ec 100%);margin:0;padding:20px 15px;color:#444;min-height:100vh;display:flex;flex-direction:column;}.container{max-width:500px;margin:0 auto;background:rgba(255,255,255,0.95);border-radius:24px;padding:30px;box-shadow:0 20px 40px rgba(255,105,180,0.15);border:1px solid rgba(255,255,255,0.8);}h2{margin:0 0 25px;text-align:center;color:#ff6060;font-size:28px;text-shadow:1px 1px 2px rgba(0,0,0,0.05);}label{font-weight:700;display:block;margin:18px 0 8px;color:#7a7a7a;font-size:15px;text-align:center;}input[type="text"],textarea,select{width:100%;padding:14px 18px;font-size:15px;border-radius:12px;border:2px solid #ffe1e6;background-color:#fffafb;color:#555;transition:all 0.3s cubic-bezier(0.4,0,0.2,1);display:block;margin:8px auto;box-sizing:border-box;font-family:'Playpen Sans',cursive;outline:none;text-align:center;}input[type="text"]:focus,textarea:focus,select:focus{border-color:#ff80ab;background-color:#ffffff;box-shadow:0 0 12px rgba(255,128,171,0.25);transform:translateY(-1px);}.btn{display:block;width:40%;margin:20px auto;background:linear-gradient(45deg,#ff6b6b,#ff80ab);color:white;font-size:14px;font-weight:700;padding:10px;border:none;border-radius:15px;cursor:pointer;transition:all 0.3s ease;box-shadow:0 6px 15px rgba(255,107,107,0.3);text-transform:uppercase;letter-spacing:1px;font-family:'Playpen Sans',cursive;}.btn:hover{transform:translateY(-3px);box-shadow:0 10px 20px rgba(255,107,107,0.4);filter:brightness(1.05);}.btn:active{transform:translateY(-1px);}#generatedLink{display:none;flex-direction:column;gap:15px;margin-top:30px;background-color:#fff0f6;padding:20px;border-radius:18px;border:2px dashed #ffc1e3;animation:slideUp 0.4s ease-out;}@keyframes slideUp{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}#generatedURL{background:#ffffff;border:1px solid #ffdae9;font-family:'Courier New',Courier,monospace;font-size:14px;color:#e91e63;padding:12px;text-align:left;}.button-group{display:flex;gap:12px;}#copyBtn,#viewBtn{flex:1;padding:12px;border-radius:12px;font-family:'Playpen Sans',cursive;font-size:15px;font-weight:700;border:none;cursor:pointer;text-decoration:none;transition:all 0.2s;display:flex;align-items:center;justify-content:center;}#copyBtn{background-color:#ff6969;color:white;}#copyBtn:hover{background-color:#ff3c3c;box-shadow:0 4px 12px rgba(255,60,60,0.3);}#viewBtn{background-color:#3498db;color:white;}#viewBtn:hover{background-color:#2980b9;box-shadow:0 4px 12px rgba(52,152,219,0.3);}@media screen and (max-width:480px){.container{padding:20px;border-radius:20px;}h2{font-size:24px;}.button-group{flex-direction:column;}}footer{margin-top:30px;text-align:center;color:#888;font-size:14px;}
    </style>
</head>
<body>
    <div id="devlekimlam"></div><div id="Devpan" style="display:none"></div>

<div id="loading-screen"><div class="spinner"></div><div id="loading-text">Loading</div></div><div class="container"><h2>Nhập lời chúc</h2><form id="textForm"><label>Thông điệp</label><input type="text" id="line1Input" placeholder="Chúc mừng sinh nhật"><input type="text" id="line2Input" placeholder="Bạn yêu"><label>Biểu tượng/icon:</label><select id="heartInput"><option value="😘">😘</option><option value="❤️">❤️</option><option value="🇻🇳">🇻🇳</option><option value="🎂">🎂</option><option value="🎉">🎉</option><option value="💝">💝</option><option value="😍">😍</option><option value="💗">💗</option></select><label>Chọn nhạc nền:</label><select id="musicInput"><option value="">-- Không chọn --</option><option value="a/1.mp3">Happy birthday</option><option value="a/2.mp3">Phép màu</option><option value="a/3.mp3">Lễ đường</option><option value="a/4.mp3">Từng ngày yêu em</option></select><button type="submit" class="btn">Tạo link</button></form><div id="generatedLink" style="display: none;"><div class="link-container"><input type="text" id="generatedURL" readonly><div class="button-group"><a id="viewBtn" href="#" target="_blank">Xem trang</a><button id="copyBtn" onclick="copyLink(this)">Copy</button></div></div></div></div>
    <script>
        // Loading screen fadeout
        window.addEventListener('load', () => {
            setTimeout(() => {
                const ls = document.getElementById('loading-screen');
                if (ls) ls.style.display = 'none';
            }, 300);
        });

        
    </script>
    <script src="./js/textanim.js"></script>
</body>
</html>
